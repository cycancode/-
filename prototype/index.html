<title>Sprout 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
:root{
  --desk:#EBEDF0;--sheet:#FFFFFF;--sheet-2:#F4F5F7;
  --ink:#111418;--ink-2:#474D55;--ink-3:#6B717B;
  --rule:#D9DCE1;
  --pen:#2436C4;--pen-wash:#EAEDFC;--pen-on:#FFFFFF;
  --risk:#9A5B00;--risk-wash:#F8EFDD;
  --pass:#2F6B4F;
  --scrim:rgba(17,20,24,.28);
  --shadow-sheet:0 24px 64px -24px rgba(17,20,24,.30);
  --glyph-a:.07;
  --f-voice:"Noto Serif SC","Songti SC",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-fig:"Source Serif 4","Noto Serif SC",serif;
  --f-mono:"Source Code Pro","Noto Sans SC",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  --mast:62px;--duty:36px;--gut:clamp(0px,3vw,40px);
  --tabh:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --desk:#0C0F13;--sheet:#13171D;--sheet-2:#1A1F26;
  --ink:#E8EBEE;--ink-2:#AEB5BE;--ink-3:#858D98;
  --rule:#313843;
  --pen:#8E9CFF;--pen-wash:#1B2140;--pen-on:#0C0F13;
  --risk:#E0A548;--risk-wash:#2A2114;
  --pass:#6FC39A;
  --scrim:rgba(0,0,0,.55);
  --shadow-sheet:0 24px 64px -16px rgba(0,0,0,.70);
  --glyph-a:.09;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0C0F13;--sheet:#13171D;--sheet-2:#1A1F26;
  --ink:#E8EBEE;--ink-2:#AEB5BE;--ink-3:#858D98;
  --rule:#313843;
  --pen:#8E9CFF;--pen-wash:#1B2140;--pen-on:#0C0F13;
  --risk:#E0A548;--risk-wash:#2A2114;
  --pass:#6FC39A;
  --scrim:rgba(0,0,0,.55);
  --shadow-sheet:0 24px 64px -16px rgba(0,0,0,.70);
  --glyph-a:.09;
}
:root[data-theme="light"]{color-scheme:light}
@media (max-width:760px){:root{--mast:54px;--duty:32px;--tabh:calc(64px + env(safe-area-inset-bottom))}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 15px/1.7 var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;border-radius:2px;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:500}
select{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;height:32px;padding:0 8px;font-size:13px}
input[type=text],input[type=password],textarea.plain{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:6px 10px;font-size:14px;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px;line-height:1.7;font-variant-numeric:tabular-nums}
.fig{font-family:var(--f-fig);font-weight:300;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.voice{font-family:var(--f-voice);font-weight:600}
.label{font:500 12px/1.4 var(--f-ui);letter-spacing:.12em;color:var(--ink-3)}
.i2{color:var(--ink-2)}.i3{color:var(--ink-3)}.pen{color:var(--pen)}.risk{color:var(--risk)}.pass{color:var(--pass)}
.small{font-size:13px}
.h1{font:400 clamp(26px,3.2vw,36px)/1.2 var(--f-ui);letter-spacing:-.01em}
.h2{font:500 20px/1.3 var(--f-ui)}
.h3{font:500 16px/1.4 var(--f-ui)}
.lk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;font-size:inherit}
.lk:hover{text-decoration-thickness:2px}
.demo{color:var(--ink-3);text-decoration:underline dashed 1px;text-underline-offset:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--ink-3);color:var(--ink-3);font-size:11px;line-height:16px;padding:0 5px;border-radius:2px;font-weight:400;letter-spacing:0;vertical-align:middle}
.dbl{border-bottom:4px double var(--ink);padding-bottom:1px}
.caps{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;background:var(--ink);color:var(--sheet);border-radius:2px;font-size:14px;font-weight:500;white-space:nowrap;transition:opacity .12s var(--ease)}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.35}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:2px;font-size:14px;white-space:nowrap;color:var(--ink);background:var(--sheet)}
.ghost:hover{border-color:var(--ink-3)}
.ghost.sm{height:32px;padding:0 10px;font-size:13px}
.ghost[aria-pressed=true]{border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow-x:auto;flex:none;max-width:100%;scrollbar-width:none}
.seg button{height:30px;padding:0 10px;font-size:13px;color:var(--ink-2);border-left:1px solid var(--rule);border-radius:0;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.chipf{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border:1px solid var(--rule);border-radius:2px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chipf[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
.kc{display:inline-block;font:500 11px/18px var(--f-mono);min-width:18px;padding:0 3px;border:1px solid var(--rule);text-align:center;border-radius:2px;color:var(--ink-3)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:2px;height:32px}
.stepper button{width:32px;height:30px;font:500 16px var(--f-mono)}
.stepper output{min-width:64px;text-align:center;font:500 13px var(--f-mono);border-inline:1px solid var(--rule);line-height:30px}

/* role mark & kind tag */
.rm{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--ink-2);border-radius:2px;font:700 12px/1 var(--f-ui);color:var(--ink);flex:none;vertical-align:middle;background:var(--sheet)}
.rm.you{border-color:var(--pen);color:var(--pen)}
.rm.sm{width:16px;height:16px;font-size:10px}
.kt{display:inline-flex;align-items:center;height:20px;padding:0 4px;border:1px solid var(--ink-3);border-radius:2px;font:500 12px/1 var(--f-ui);color:var(--ink-2);white-space:nowrap;flex:none;vertical-align:middle;background:transparent}
.kt.pen{border-color:var(--pen);color:var(--pen)}
.kt.risk{border-color:var(--risk);color:var(--risk)}
button.kt:hover{background:var(--pen-wash)}
button.kt.risk:hover{background:var(--risk-wash)}
.lock{display:inline-block;width:11px;height:12px;vertical-align:-1px;flex:none}

/* masthead */
.mast{position:sticky;top:0;z-index:40;height:var(--mast);background:var(--sheet);border-bottom:3px solid var(--ink)}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--rule)}
.mast-in{display:flex;align-items:center;gap:28px;height:56px;padding:0 24px 0 calc(var(--gut) + 48px)}
.wm{display:flex;align-items:center;gap:8px;font:500 16px var(--f-ui);white-space:nowrap}
.nav{display:flex;gap:22px;align-items:stretch;height:56px}
.nav button{position:relative;display:flex;align-items:center;font-size:14px;color:var(--ink-2);white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);font-weight:500}
.nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:var(--ink)}
.cnt{display:inline-block;min-width:20px;height:20px;padding:0 5px;margin-left:6px;border:1.5px solid var(--pen);color:var(--pen);font:500 12px/17px var(--f-mono);border-radius:2px;text-align:center}
.cnt.z{border-color:var(--rule);color:var(--ink-3)}
.cntp{margin-left:5px;font:12.5px var(--f-mono);color:var(--ink-3)}
.mast-r{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13px;white-space:nowrap}
.mast-r .lnk{color:var(--ink)}
.halt{position:relative;overflow:hidden;color:var(--ink-3);height:30px;padding:0 8px;touch-action:none;user-select:none;-webkit-user-select:none}
.halt:hover{color:var(--risk)}
.halt .fill,.holdfill{position:absolute;inset:0;background:var(--risk-wash);transform-origin:left;transform:scaleX(var(--p,0));pointer-events:none}
.halt span{position:relative}
@media (max-width:760px){
  .mast-in{height:48px;padding:0 16px;gap:12px}
  .nav,.mast-r .dsk{display:none}
  .mast-r{gap:10px}
}

/* duty strip */
.duty{position:sticky;top:var(--mast);z-index:39;height:var(--duty);background:var(--sheet-2);border-bottom:1px solid var(--rule);display:flex;align-items:center}
.duty-sc{flex:1;min-width:0;height:100%;overflow-x:auto;overflow-y:hidden;display:flex;gap:8px;align-items:center;padding:0 12px 0 calc(var(--gut) + 48px);scrollbar-width:none}
.duty-sc::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 4px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.chip b{font-weight:500;color:var(--ink)}
.chip .bar{position:absolute;left:-1px;bottom:-1px;height:1px;background:var(--ink);width:var(--w,0%);transition:width .3s linear}
.chip .mono{font-size:12px}
.chip.enter{animation:chipin .32s var(--ease)}
@keyframes chipin{from{transform:translateX(8px);opacity:0}}
.duty-fig{flex:none;height:100%;display:flex;align-items:center;gap:12px;padding:0 16px;border-left:1px solid var(--rule);font:12.5px var(--f-mono);white-space:nowrap;background:var(--sheet-2)}
.duty-fig button{font-size:12.5px;color:var(--ink-2);border:1px solid var(--rule);height:22px;padding:0 6px;font-family:var(--f-ui)}
.duty-fig button[aria-pressed=true]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.duty.stop{background:var(--risk-wash);color:var(--risk)}
.duty.stop .duty-sc{font-size:13px;gap:12px}
.duty.stop button.lk{color:var(--risk)}
@media (max-width:760px){.duty-sc{padding-left:16px}.duty-fig{padding:0 12px}.duty-fig .dsk{display:none}.chip{height:24px}}

/* sheet */
.desk{padding:24px 0 104px}
.sheet{background:var(--sheet);border:1px solid var(--rule);margin-left:var(--gut);margin-right:clamp(0px,2vw,24px);max-width:1240px;padding:40px 48px 48px;min-height:70vh}
@media (max-width:760px){.desk{padding:0 0 calc(var(--tabh) + 24px)}.sheet{border:0;margin:0;padding:20px 16px 32px;max-width:none}}
.cols{display:grid;grid-template-columns:minmax(0,720px) 320px;column-gap:56px;align-items:start}
.cols>.main{min-width:0}
.margin{border-left:1px solid var(--rule);padding-left:28px;position:sticky;top:calc(var(--mast) + var(--duty) + 10px);display:flex;flex-direction:column;gap:28px}
@media (max-width:1179px){
  .cols{display:flex;flex-direction:column;align-items:stretch}
  .cols>.main{display:contents}
  .margin{position:static;border:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:24px 32px;margin-top:32px}
  .o1{order:1}.o2{order:2}.o3{order:3}.margin{order:4}.o4{order:5}.o5{order:6}.o6{order:7}.o7{order:8}.o8{order:9}.o9{order:10}.o10{order:11}.o11{order:12}
}
@media (max-width:760px){
  .margin{order:9;gap:20px 16px}
  .o3{order:3}.o5{order:4}.o4{order:5}.o6{order:6}.o7{order:7}.o8{order:8}.o9{order:10}.o10{order:11}.o11{order:12}
  .dskonly{display:none!important}
}
@media (min-width:761px){.phoneonly{display:none!important}}
.sec{margin-top:48px}
.sec-h{border-top:2px solid var(--ink);padding-top:12px;margin-bottom:12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
@media (max-width:760px){.sec{margin-top:32px}}
.hair{border-top:1px solid var(--rule)}
.metaline{font:12.5px var(--f-mono);color:var(--ink-3)}.metaline .rm{margin-right:6px;vertical-align:-4px}
.headline{font:300 clamp(30px,4.6vw,56px)/1.15 var(--f-ui);letter-spacing:-.01em;margin:36px 0 16px}
.headline .u{text-decoration:underline 2px var(--pen);text-underline-offset:.16em}
.standfirst{font-size:17px;line-height:1.8;color:var(--ink-2);max-width:38em}
.foot{margin-top:56px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
.foot button{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}

/* capture */
.cap{margin-top:24px}
.cap-field{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink)}
.cap-in{display:block;flex:1;min-width:8em;width:100%;border:0;background:transparent;resize:none;font:600 clamp(26px,2.8vw,40px)/1.3 var(--f-voice);caret-color:var(--pen);padding:4px 0 10px;outline:none;overflow:hidden;color:var(--ink)}
.cap-in::placeholder{color:var(--ink-3);opacity:1}
.cap-field:focus-within{border-bottom-color:var(--ink)}
.cap-field:focus-within{box-shadow:0 1px 0 var(--ink)}
.tok{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px;border:1px solid var(--ink-3);border-radius:2px;font:500 13px var(--f-mono);color:var(--ink-2);align-self:center;flex:none}
.tok button{font-size:12px;color:var(--ink-3);width:16px}
.cap-voice{flex:1;min-width:8em;font:600 clamp(26px,2.8vw,40px)/1.3 var(--f-voice);padding:4px 0 10px;min-height:1.3em}
.cap-voice .c{color:var(--ink-3);transition:color .3s}
.cap-voice .c.s{color:var(--ink)}
.cap-voice .fl{position:relative;display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;transition:max-width .25s var(--ease),opacity .25s;max-width:6em}
.cap-voice .fl::after{content:"";position:absolute;left:0;top:55%;height:1px;background:var(--ink-3);width:0;transition:width .2s linear}
.cap-voice .fl.x::after{width:100%}
.cap-voice .fl.x{color:var(--ink-3)}
.cap-voice .fl.gone{max-width:0;opacity:0}
.cap-ctl{display:flex;align-items:center;gap:12px;min-height:44px;margin-top:10px;flex-wrap:wrap}
.cap-hint{font-size:12.5px;color:var(--ink-3)}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.mic svg{width:18px;height:18px}
.mic.rec{background:var(--pen);border-color:var(--pen);color:var(--pen-on)}
.rec-ind{display:inline-flex;align-items:center;gap:8px;color:var(--pen);font:12.5px var(--f-mono)}
.wave{display:inline-flex;gap:2px;align-items:center;height:18px}
.wave i{display:block;width:3px;height:100%;background:var(--pen);transform-origin:center;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.route{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--ink-3);border-radius:2px;font-size:13px;color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.route em{font-style:normal;color:var(--pen);font-size:12px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sugg button{height:30px;padding:0 10px;border:1px dashed var(--rule);border-radius:2px;font-size:13px;color:var(--ink-3)}
.sugg button:hover{color:var(--ink);border-color:var(--ink-3)}
.vchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border:1px solid var(--rule);border-radius:2px;font:12px var(--f-mono);color:var(--ink-2);margin-top:8px}
.menu{position:absolute;z-index:70;background:var(--sheet);border:1px solid var(--ink-3);border-radius:2px;box-shadow:var(--shadow-sheet);min-width:200px;padding:4px 0}
.menu button{display:block;width:100%;padding:8px 14px;font-size:14px;text-align:left}
.menu button:hover{background:var(--sheet-2)}
.menu .label{padding:6px 14px 2px}

/* bottom bar */
.bar{position:fixed;bottom:0;z-index:45;left:calc(var(--gut) + 1px);width:min(calc(720px + 96px),calc(100vw - var(--gut) - 16px));height:56px;background:var(--sheet);border-top:1px solid var(--rule);border-right:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:0 16px 0 48px;transition:transform .24s var(--ease)}
.bar.off{transform:translateY(110%)}
.bar input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--rule);height:34px;background:transparent;font-size:15px;outline:none}
.bar input:focus{border-bottom-color:var(--ink)}
.bar .mic{width:34px;height:34px}
.bar .route{max-width:220px}
@media (max-width:760px){.bar{display:none}}

/* tabs (phone) */
.tabs{display:none}
@media (max-width:760px){
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom);background:var(--sheet);border-top:1px solid var(--rule)}
  .tabs>button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2);position:relative}
  .tabs>button.on{color:var(--ink);font-weight:500}
  .tabs>button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--ink)}
  .tabs .ic{height:22px;display:flex;align-items:center}
  .tabs .cmic{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;margin-top:-18px}
  .tabs .cmic svg{width:20px;height:20px}
  .tabs .cmic.rec{background:var(--pen);color:var(--pen-on)}
  .tabs .cnt{margin:0}
}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fadein .36s var(--ease)}
.scrim.pass{pointer-events:none}
@keyframes fadein{from{opacity:0}}
.side{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100vw;z-index:61;background:var(--sheet);box-shadow:var(--shadow-sheet);border-left:1px solid var(--rule);display:flex;flex-direction:column;animation:sidein .36s ease-out}
@keyframes sidein{from{transform:translateX(40px);opacity:0}}
.side-bd{flex:1;overflow-y:auto;padding:24px 28px 24px;overscroll-behavior:contain}
.side-hd{display:flex;align-items:center;gap:8px;padding:14px 20px 0 28px}
.xbtn{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;font-size:18px;color:var(--ink-2)}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--sheet);box-shadow:var(--shadow-sheet);border-top:1px solid var(--rule);max-height:88vh;display:flex;flex-direction:column;animation:bsin .36s ease-out}
.bsheet .grab{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 0;flex:none}
.bsheet .side-bd{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
@keyframes bsin{from{transform:translateY(40px);opacity:0}}
.capsheet{position:fixed;bottom:0;z-index:61;left:calc(var(--gut) + 1px);width:min(760px,calc(100vw - var(--gut) - 16px));height:72vh;background:var(--sheet);box-shadow:var(--shadow-sheet);border:1px solid var(--rule);border-bottom:0;display:flex;flex-direction:column;animation:bsin .36s ease-out}
@media (max-width:760px){
  .side{top:auto;left:0;width:auto;height:88vh;border-left:0;border-top:1px solid var(--rule);animation:bsin .36s ease-out}
  .side::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 0;flex:none}
  .side-bd{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
  .side-hd{padding:4px 12px 0 16px}
  .capsheet{left:0;width:100%;height:90vh;border-left:0;border-right:0}
  .capsheet .cap-in,.capsheet .cap-voice{font-size:24px}
}
.morelist button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;border-top:1px solid var(--rule);font-size:16px;padding:0 4px;position:relative;overflow:hidden}
.morelist button span{position:relative}
.keys td{padding:6px 12px 6px 0;border-top:1px solid var(--rule);font-size:13px;vertical-align:top}

/* toasts */
.toasts{position:fixed;left:calc(var(--gut) + 16px);bottom:72px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(440px,calc(100vw - 32px))}
.toasts{pointer-events:none}.toast button{pointer-events:auto}
.toast{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:2px;box-shadow:var(--shadow-sheet);font-size:14px;animation:bsin .24s var(--ease)}
.toast button{color:var(--sheet);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;font-weight:500}
.toast .grow{min-width:0}
@media (max-width:760px){.toasts{left:16px;bottom:calc(var(--tabh) + 12px)}}

/* track */
.trk{display:inline-flex;gap:3px;align-items:flex-end;vertical-align:middle;padding-top:9px}
.trk i{position:relative;display:block;width:28px;height:3px;background:var(--rule);font-style:normal}
.trk i.d{background:var(--ink)}
.trk i.w{background:var(--ink-2);overflow:hidden}
.trk i.w::after{content:"";position:absolute;top:0;bottom:0;left:-24px;width:24px;background:var(--sheet);opacity:.6;animation:glide 2.4s linear infinite}
.trk i.p{background:var(--pen)}
.trk i.p::before{content:"";position:absolute;left:50%;top:-9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--pen)}
.trk i.s{background:var(--risk)}
@keyframes glide{to{transform:translateX(88px)}}
.trkx{display:grid;grid-template-columns:repeat(6,minmax(64px,1fr));gap:4px;margin-top:12px;overflow-x:auto}
.trkx .st{position:relative;padding-top:12px;font-size:12px;color:var(--ink-3);min-width:0}
.trkx .st::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--rule)}
.trkx .st.d::before{background:var(--ink)}
.trkx .st.w::before{background:var(--ink-2)}
.trkx .st.p::before{background:var(--pen)}
.trkx .st.s::before{background:var(--risk)}
.trkx .st.p::after{content:"";position:absolute;left:0;top:-9px;width:6px;height:6px;border-radius:50%;background:var(--pen)}
.trkx .st b{display:block;font-weight:500;color:var(--ink);font-size:12.5px}
.trkx .st.f b{color:var(--ink-3);font-weight:400}
.trkx .st .mono{font-size:11.5px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.trkx .glide{position:absolute;top:0;left:0;height:3px;width:24px;background:var(--sheet);opacity:.6;animation:glide2 2.4s linear infinite}
@keyframes glide2{from{left:-24px}to{left:100%}}
@media (max-width:760px){
  .trkx{grid-template-columns:1fr;gap:0}
  .trkx .st{display:grid;grid-template-columns:3px 64px 1fr;gap:10px;padding:6px 0 6px;align-items:center}
  .trkx .st::before{position:static;width:3px;height:100%;min-height:20px;grid-row:1}
  .trkx .st.p::after{left:-2px;top:50%;margin-top:-3px}
  .trkx .glide{display:none}
}

/* ruler */
.ruler{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:28px}
.ruler>button{min-height:44px;padding:8px 10px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;text-align:left;border-radius:0}
.ruler>button:first-child{border-left:0}
.ruler>button:hover{background:var(--sheet-2)}
.ruler>button[aria-pressed=true]{background:var(--sheet-2);box-shadow:inset 0 -2px 0 var(--ink)}
.ruler .nm{font:500 13px var(--f-ui)}
.ruler .n{font:300 22px/1.1 var(--f-fig);font-variant-numeric:tabular-nums}
.ruler .n small{font:12px var(--f-ui);color:var(--ink-3);margin-right:4px}
.ruler .dots{font-size:12px;color:var(--pen);display:flex;gap:6px;flex-wrap:wrap}
.ruler .dots .risk{color:var(--risk)}
@media (max-width:760px){.ruler{grid-template-columns:repeat(3,1fr)}.ruler>button:nth-child(4){border-left:0}.ruler>button:nth-child(n+4){border-top:1px solid var(--rule)}}

/* stack & register */
.stack-hd{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.stack-hd .h2{margin-right:2px}
.stack-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.navbtn{width:32px;height:30px;border:1px solid var(--rule);border-radius:2px;font:500 15px var(--f-mono)}
.edges{position:relative;height:10px;margin-top:-1px}
.edges::before,.edges::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:1px;background:var(--rule)}
.edges::after{left:8px;right:8px;top:7px}
.reg{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:48px;width:100%;border-top:1px solid var(--rule);padding:6px 4px 6px 12px;position:relative;text-align:left;border-radius:0}
.reg::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--pen)}
.reg.signed::before{display:none}
.reg.signed{color:var(--ink-3)}
.reg:hover{background:var(--sheet-2)}
.reg[aria-current=true]{background:var(--sheet-2)}
.reg .t{min-width:0}
.reg .t .ti{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .t .af{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .w{font:12px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.reg .imp{font:400 16px var(--f-fig);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:72px}
.reg .imp.risk{font-family:var(--f-ui);font-size:13px}
.reg .newt{font:11px var(--f-mono);color:var(--ink-3);border:1px solid var(--rule);padding:0 4px;margin-left:6px;border-radius:2px}
.reg .ck{width:18px;height:18px;accent-color:var(--ink)}
.lp .reg{grid-template-columns:auto minmax(0,1fr) auto}.lp .reg .w{display:none}.lp .reg .t .ti{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grp{font:500 12px var(--f-ui);letter-spacing:.12em;color:var(--ink-3);padding:14px 0 6px}
@media (max-width:760px){.reg{grid-template-columns:auto minmax(0,1fr) auto}.reg .w{display:none}}
.tray{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
.tray-ln{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3);padding:6px 0;border-top:1px solid var(--rule)}
.mmark{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--pen);color:var(--pen);padding:0 6px;font:11.5px var(--f-mono);border-radius:0}
.mmark b{font:700 12px var(--f-ui)}
.closing{display:inline-block;margin-top:20px;border:1.5px solid var(--pen);color:var(--pen);padding:8px 14px;font:500 14px var(--f-ui)}
.fold{overflow:hidden;transition:max-height .28s var(--ease),opacity .28s;max-height:var(--h,2000px)}
.fold.go{max-height:0!important;opacity:0}
.rise{animation:rise .32s var(--ease)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

/* doc */
.doc{position:relative;padding:20px 0 4px;border-top:1px solid var(--rule)}
.doc.first{border-top:0}
.doc-red{background:var(--risk-wash);color:var(--risk);font-size:13px;padding:8px 12px;margin-bottom:14px;display:flex;gap:8px;align-items:center;font-weight:500}
.doc-hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font:12.5px var(--f-mono);color:var(--ink-3)}
.doc-title{font:500 clamp(20px,2.4vw,26px)/1.3 var(--f-ui);margin:10px 0 8px;letter-spacing:-.005em}
.doc-from{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.doc-sit{font-size:15px;margin:12px 0 0;max-width:38em}
.doc-why{font-size:14px;color:var(--ink-2);margin-top:6px}
.doc-mat{margin-top:16px}
.doc-sug{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.opts{margin-top:10px;border-bottom:1px solid var(--rule)}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--rule);padding:6px 4px;cursor:pointer;width:100%;text-align:left;border-radius:0}
.opt:hover{background:var(--sheet-2)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;position:relative}
.opt[aria-checked=true] .rd{border-color:var(--pen)}
.opt[aria-checked=true] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pen)}
.opt .ot{flex:1;min-width:0;font-size:14.5px}
.opt .rec{font-size:12px;color:var(--pen);border:1px solid var(--pen);padding:0 4px;margin-left:6px;border-radius:2px;white-space:nowrap}
.opt .imp{font:12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.opt .imp.over{color:var(--risk)}
.doc-after{color:var(--ink-2);font-size:14px;margin-top:14px}
.verdict{font:12.5px var(--f-mono);color:var(--ink-3);margin-top:6px}
.verdict.over{color:var(--risk)}
.sigrow{display:flex;align-items:flex-end;gap:12px;margin-top:22px;position:relative}
.sigline{position:relative;width:240px;max-width:52vw}
.sigline .rl{height:34px;border-bottom:1px solid var(--ink);position:relative}
.sigline svg{position:absolute;left:0;bottom:-1px;width:100%;height:3px;overflow:visible}
.sigline svg line{stroke:var(--pen);stroke-width:1.5;stroke-dasharray:240;stroke-dashoffset:calc(240 - 240 * var(--p,0))}
.sigline .cap{font-size:12px;color:var(--ink-3);margin-top:4px}
.sigdate{font:12.5px var(--f-mono);color:var(--ink-3);padding-bottom:22px}
.mark{position:absolute;right:0;bottom:-2px;border:1.5px solid var(--pen);color:var(--pen);padding:3px 10px;text-align:center;background:var(--sheet);animation:markin .16s var(--ease);white-space:nowrap}
.mark b{display:block;font:700 13px/1.3 var(--f-ui)}
.mark span{font:11px var(--f-mono)}
@keyframes markin{from{transform:scale(1.06);opacity:0}}
.signblk{margin-top:12px;padding-bottom:8px}
.sign{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;height:44px;width:320px;max-width:100%;border:1.5px solid var(--pen);color:var(--pen);border-radius:2px;font-weight:500;font-size:14px;padding:0 14px;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--sheet)}
.sign .fill{position:absolute;inset:0;background:var(--pen-wash);transform-origin:left;transform:scaleX(var(--p,0));pointer-events:none}
.sign span{position:relative}
.sign:hover{background:var(--pen-wash)}
.sign:disabled{border-color:var(--rule);color:var(--ink-3);background:var(--sheet)}
.sign.armed{background:var(--pen);color:var(--pen-on)}
.sign.primary{background:var(--pen);color:var(--pen-on)}
.sign.primary:hover{opacity:.9}
.undo-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.signalt{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.retreat{margin-top:12px;border-left:2px solid var(--ink);padding-left:12px}
.retreat textarea{width:100%;min-height:72px;border:1px solid var(--rule);background:var(--sheet);padding:8px 10px;font-size:14px;border-radius:2px;resize:vertical}
@media (max-width:760px){
  .sign{width:100%}
  .signblk.stick{position:sticky;bottom:var(--tabh);z-index:5;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 0}
  .sigline{width:200px}
}
.btable{width:100%;border-collapse:collapse;font-size:13px}
.btable th{font:500 12px var(--f-ui);letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--ink)}
.btable td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.btable td.m{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.btable tr.tot td{border-bottom:4px double var(--ink);font-family:var(--f-mono);font-size:12.5px}
.tscroll{overflow-x:auto;max-width:100%}
.attempts{font:12.5px/1.9 var(--f-mono);color:var(--ink-2);background:var(--sheet-2);padding:10px 12px}
.attempts .tot{border-top:1px solid var(--rule);margin-top:4px;padding-top:4px;color:var(--ink)}
.evid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:600px){.evid{grid-template-columns:1fr}}
.tests .p{color:var(--pass);font-weight:500;font-size:14px}
.tests .mono{display:block;color:var(--ink-2)}
.cmap{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.cmap td{border-top:1px solid var(--rule);padding:6px 8px 6px 0;vertical-align:top}
.cmap td:last-child{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.redl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.redl span{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--risk);border:1px solid var(--risk);padding:2px 8px;border-radius:2px}
.mail{border:1px solid var(--rule);padding:14px 16px;background:var(--sheet-2);font-size:13.5px}
.mail .s{font-weight:500;margin-bottom:6px}
.mail ul{margin:0;padding-left:18px;color:var(--ink-2)}

/* mock phone screen */
.shot{width:200px;border:1px solid var(--rule);border-radius:22px;padding:14px 12px 16px;background:#FBFBFC;color:#111418;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px}
.shot .isl{width:56px;height:14px;border-radius:8px;background:#111418;margin-bottom:4px}
.shot .st{font:500 15px var(--f-ui);align-self:flex-start}
.shot .qr{display:grid;grid-template-columns:repeat(21,1fr);width:126px;height:126px;border:6px solid #fff;outline:1px solid #D9DCE1}
.shot .qr i{background:#111418}.shot .qr i.o{background:transparent}
.shot .url{font:11px var(--f-mono);color:#474D55}
.shot .cta{width:100%;height:30px;border-radius:8px;background:#111418;color:#fff;display:grid;place-items:center;font-size:12px}
.shot .big{font:300 26px/1.1 var(--f-fig);align-self:flex-start}
.shot .row2{align-self:stretch;display:flex;justify-content:space-between;border-top:1px solid #E3E5E9;padding-top:6px}

/* receipts */
.rcpt{margin-top:28px;border-top:1px solid var(--rule);padding-top:16px}
.rcpt-hd{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rcpt-say{font:600 22px/1.4 var(--f-voice);flex:1;min-width:12em}
.rcpt-say.lift{animation:lift .32s var(--ease)}
@keyframes lift{from{transform:translateY(-24px);font-size:34px;opacity:.4}}
.rcpt-meta{font:12px var(--f-mono);color:var(--ink-3);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spine{position:relative;margin-top:14px;padding-left:0}
.spine::before{content:"";position:absolute;left:73px;top:4px;bottom:4px;width:1px;background:var(--rule)}
.rl-ln{display:grid;grid-template-columns:64px 20px minmax(0,1fr);gap:0 10px;align-items:start;padding:4px 0;font-size:14px;position:relative}
.rl-ln .tm{font:12px/20px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.rl-ln .tx{line-height:20px;min-width:0}
.rl-ln.you .tx{color:var(--pen)}
.rl-ln .tx .mono{font-size:12.5px}
.rl-ln.enter{animation:lnin .18s var(--ease) both}
@keyframes lnin{from{opacity:0;transform:translateY(4px)}}
.caret{display:inline-block;width:1ch;height:1em;background:var(--pen);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rl-blk{margin:6px 0 6px 94px;min-width:0}
@media (max-width:760px){.rl-blk{margin-left:0}.spine::before{left:73px}}
.handoff{position:absolute;left:73px;top:-28px;width:1.5px;height:30px;background:var(--ink);transform-origin:top;animation:hand .6s linear both}
@keyframes hand{from{transform:scaleY(0)}}
.slip{border:1px solid var(--rule);padding:10px 14px 12px;max-width:560px}
.slip-hd{display:flex;gap:8px;align-items:center;font:12px var(--f-mono);color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap}
.slip-r{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:3px 0;font-size:14px;align-items:baseline}
.slip-r .k{font:500 12px var(--f-ui);color:var(--ink-3);letter-spacing:.06em}
.slip-r.need .v{color:var(--pen)}
.slip-r.enter{animation:lnin .18s var(--ease) both}
.slip-r.re{animation:refill .3s var(--ease) both}
@keyframes refill{from{opacity:0;transform:translateX(-4px)}}
.slip-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;position:relative}
.slip.folded{padding:6px 10px;font-size:13px;color:var(--ink-2)}
.slipline{font:12.5px var(--f-mono);color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini{border-left:1px solid var(--ink);padding-left:12px;margin:4px 0}
.mini-r{display:grid;grid-template-columns:14px 60px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.mini-r .mono{font-size:12px}
.mini-r.enter{animation:lnin .18s var(--ease) both}
.mini-r .md{font-size:12px;color:var(--ink-2);white-space:nowrap;display:flex;gap:4px;align-items:center}
@media (max-width:760px){.mini-r{grid-template-columns:14px 50px minmax(0,1fr) auto}.mini-r .md{display:none}}
.inline-doc{border:1px solid var(--rule);padding:4px 16px 12px;background:var(--sheet)}
.inline-doc .doc{border-top:0;padding-top:12px}

/* inbox */
.irow{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;padding:20px 0;border-top:1px solid var(--rule)}
.irow .idea{font:600 20px/1.5 var(--f-voice);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.irow .full{grid-column:1/-1}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.raw{margin-top:8px;font-size:14px;color:var(--ink-2);background:var(--sheet-2);padding:8px 10px}

.play{position:relative;overflow:hidden}
.play .pb{position:absolute;left:0;bottom:0;height:2px;background:var(--ink);width:0}

@keyframes pb{to{width:100%}}
@media (max-width:760px){.irow{grid-template-columns:1fr;gap:12px}}
.bizrow{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:6px 16px;align-items:center;min-height:52px;border-top:1px solid var(--rule);width:100%;text-align:left;padding:8px 0;border-radius:0}
.bizrow:hover{background:var(--sheet-2)}
.bizrow .nm{font:500 16px var(--f-ui)}
.segbar{display:flex;gap:2px;height:4px;width:160px}
.segbar i{flex:1;background:var(--rule)}
.segbar i.d{background:var(--ink)}.segbar i.p{background:var(--pen)}.segbar i.w{background:var(--ink-2)}
@media (max-width:760px){.bizrow{grid-template-columns:minmax(0,1fr)}.bizrow>.row{justify-content:flex-start!important}.bizrow .segbar{width:100%}}

/* margin figures */
.mfig .big{font:300 44px/1.05 var(--f-fig);font-variant-numeric:tabular-nums lining-nums}

/* Track */
function trackData(i){
 if(i.alt==='report')return [{s:'收件',c:'d',tip:`收件 · ${i.tk[0]?i.tk[0][0]:''} · 幕僚长`},{s:'汇报',c:'d',tip:'汇报 · 幕僚长 · Claude Opus 5.5'}];
 const n=i.tk.length, out=[];
 for(let s=0;s<6;s++){
  let c='f';
  if(i.mode==='done')c='d';
  else if(s<n)c='d';
  else if(s===n&&i.mode!=='done-arch')c={wait:'p',work:'w',stuck:'s'}[i.mode]||'f';
  const e=i.tk[s];
  let label=STATIONS[s]; if(s===3&&i.rework&&s>=n)label='返工';
  const tip=e?`${STATIONS[s]} · ${e[0]} · ${e[2]||ROLE[e[1]]}`:(c==='p'?`${label} · 等你`:c==='w'?`${label} · 进行中`:c==='s'?`${label} · 卡住了`:`${label} · 还没到`);
  out.push({s:label,c,e,tip});
 }
 return out;
}

function Stack(){
 const all=desk(), items=stackItems();
 const fold=S.ui.folding&&S.ui.folding.ctx==='stack'?S.ui.folding:null;
 let top=items.find(i=>i.key===S.ui.top)||items[0];
 let docHtml='';
 if(fold)docHtml=`<div class="fold" data-fold="${esc(fold.key)}">${Doc(fold.dv,'stack',{first:true})}</div>`;
 else if(top){const dv=docView(top.key);docHtml=`<div class="${S.ui.rise?'rise':''}">${Doc(dv,'stack',{first:true})}</div>`}
 const rest=items.filter(i=>!top||i.key!==top.key||fold);
 const restShown=fold?rest:rest;
 let rows='';
 const grouped=all.length>6;
 const late=restShown.filter(i=>i.meta.newAt), early=restShown.filter(i=>!i.meta.newAt);
 const list=(arr)=>{let h='',g=null;arr.slice(0,5).forEach(i=>{if(grouped&&i.v!==g){g=i.v;h+=`<div class="grp">${esc(S.d.V[i.v].name)}</div>`}h+=RegRow(i,'stack')});return h};
 rows=list(early);
 if(late.length)rows+=`<div class="grp">08:30 之后新到 ${late.length} 件</div>`+list(late);
 const more=restShown.length-Math.min(5,early.length)-Math.min(5,late.length);
 const idx=top?items.indexOf(top)+1:0;
 let body;
 if(!all.length&&!fold)body='';
 else if(!items.length&&!fold)body=`<div class="empty">这一格里没有等你签的。<button class="lk" data-act="station" data-i="-1">看全部</button></div>`;
 else body=`${docHtml}<div class="edges" aria-hidden="true"></div>${rows}${more>0?`<button class="lk small" data-act="go" data-r="sign" style="margin-top:10px">还有 ${more} 件 →</button>`:''}`;

 return `<section class="sec o5" id="stack" aria-label="待签">

 </section>`;
}

/* ============ tree views ============ */
function treeNodes(v,list){
 let ns=(list||nodesOf(v)).slice();
 const p=S.d.proposal;
 if(p&&p.v===v&&!list){ns=ns.map(n=>p.rm.includes(n.id)?Object.assign({},n,{rmMe:true}):n);p.add.forEach(a=>{const at=ns.findIndex(n=>n.id===a.after);const g=Object.assign({},a.node,{ghost:true});if(at>=0)ns.splice(at+1,0,g);else ns.push(g)})}
 return ns;
}
function matchFilter(n,v){
 const st=n.lv===3?n.st:rollStatus(v,n);
 const f=S.ui.tfilter;
 let ok=f==='all'||(f==='you'&&(isWait(st)||st==='stuck'))||(f==='run'&&st==='running')||(f==='done'&&st==='done');
 const r=S.ui.role;
 if(r==='eng')ok=ok&&n.lv===3&&st!=='draft';
 if(r==='qa')ok=ok&&n.lv===3&&(st==='review'||st==='done');
 if(r==='plan')ok=ok&&(n.lv<3||st==='draft');
 return ok;
}
function nodeTip(v,n){return `${n.id} ${n.t} · ${stText(n,v)} · ${n.model?MODELS[n.model]:''} · ${n.cost?usd(n.cost):n.est?'预估 '+rng(n.est[0],n.est[1]):''}`}
function MapView(v,list,o){
 o=o||{};
 const ns=o.charter?list:treeNodes(v);
 const exp=o.charter?3:S.ui.expand;
 const X=[16,304,552,812],W=[240,200,212,280],TOP=40,P=56;
 const vis=ns.filter(n=>n.lv<=exp);
 const pos={};let row=0;
 const place=n=>{const ks=vis.filter(k=>parentId(k.id)===n.id);if(!ks.length){pos[n.id]={y:TOP+row*P};row++}else{ks.forEach(place);pos[n.id]={y:(pos[ks[0].id].y+pos[ks[ks.length-1].id].y)/2}}pos[n.id].x=X[n.lv];pos[n.id].w=W[n.lv]};
 const root=vis.find(n=>n.id==='0');if(root)place(root);
 const H=TOP+Math.max(1,row)*P+4, Wd=X[exp]+W[exp]+16;
 const sibIdx={};const delay=n=>{const k=parentId(n.id)||'r';sibIdx[k]=(sibIdx[k]||0)+1;return [0,260,520,780][n.lv]+40*(sibIdx[k]-1)};
 let paths='',nodesH='';
 vis.forEach(n=>{
  const p=pos[n.id]; if(!p)return;
  const st=n.lv===3||n.st==='draft'?n.st:rollStatus(v,n,o.charter?ns:null);
  const d=o.anim?delay(n):0;
  const pid=parentId(n.id); const pp=pid&&pos[pid];
  if(pp){const x1=pp.x+pp.w,y1=pp.y+22,x2=p.x,y2=p.y+22;const len=Math.round(Math.abs(x2-x1)+Math.abs(y2-y1)+10);
   paths+=`<path class="${isWait(st)?'pw':''}${n.ghost?' gh':''}${o.anim?' anim':''}" style="--len:${len};${o.anim?`animation-delay:${Math.max(0,d-200)}ms`:''}" d="M${x1},${y1} C${x1+24},${y1} ${x2-24},${y2} ${x2},${y2}"/>`}
  const dim=!o.charter&&!matchFilter(n,v);
  const sel=S.ui.sel&&S.ui.sel.v===v&&S.ui.sel.id===n.id;
  const cls=`nd l${n.lv}${isWait(st)&&n.lv===3?' wait':''}${st==='draft'?' draft':''}${n.ghost?' ghost':''}${n.rmMe?' rm-me':''}${st==='cut'?' cut':''}${dim?' dim':''}${sel?' sel':''}${o.anim?' enter':''}${!o.anim&&!seen.has('nd-'+v+n.id)&&S.ui.treeSeen&&S.ui.treeSeen[v]?' enter':''}`;
  const ttl=`<span class="ttl${n.asm?' asm':''}" data-edit="${o.charter?'':n.id}" data-v="${v}">${esc(n.t)}${n.asm?'<sup>假设</sup>':''}</span>`;
  let inner='';
  if(n.lv===0)inner=`${ttl}`;
  else if(n.lv===1){const ls=(o.charter?ns:nodesOf(v)).filter(k=>k.lv===3&&k.id.startsWith(n.id+'.')&&k.st!=='cut');const dn=ls.filter(k=>k.st==='done').length,wt=ls.filter(k=>isWait(k.st)||k.st==='stuck').length,rn=ls.filter(k=>k.st==='running').length;
   inner=`<span class="top"><span class="id">${n.id}</span>${ttl}<span class="mono i3">${st==='draft'?'待拆解':`${dn} / ${ls.length}`}</span></span>${ls.length?`<span class="sbar">${dn?`<i class="d" style="flex:${dn}"></i>`:''}${wt?`<i class="p" style="flex:${wt}"></i>`:''}${rn?`<i class="w" style="flex:${rn}"></i>`:''}${ls.length-dn-wt-rn?`<i style="flex:${ls.length-dn-wt-rn}"></i>`:''}</span>`:''}`}
  else if(n.lv===2)inner=`${smk(st)}<span class="id">${n.id}</span>${ttl}${st==='draft'?`<span class="est">${rng(n.est[0],n.est[1],0)}</span>`:''}`;
  else inner=`${smk(st)}<span class="id">${n.id}</span>${ttl}${st==='running'?`<span class="mono" data-live="pct|${v}|${n.id}">${n.pct}%</span>`:''}${o.charter?`<span class="est" ${o.anim?`style="animation:ndin .3s ${d+300}ms both"`:''}>${rng(n.est[0],n.est[1])}</span>`:''}${n.red?'<span class="kt risk">红线</span>':''}<span class="mh">${RoleMark('工','sm')} ${MHINT[n.model]||''}</span>`;
  const label=n.lv===0?`愿景：${n.t}`:`${n.id} ${n.t} · ${stText(n,v)}`;
  nodesH+=`<button class="${cls}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;${o.anim?`--d:${d}ms;animation-delay:${d}ms`:''}" ${o.charter||n.ghost?'':`data-act="node" data-v="${v}" data-id="${n.id}"`} ${n.lv===3?`data-tip="${esc(nodeTip(v,n))}"`:''} aria-label="${esc(label)}" data-nid="${n.id}">${inner}</button>`;
  if(!o.anim)seen.add('nd-'+v+n.id);
 });
 if(!S.ui.treeSeen)S.ui.treeSeen={};S.ui.treeSeen[v]=true;
 const heads=['愿景 L0','里程碑 L1','功能 L2','工单 L3'].slice(0,exp+1).map((h,k)=>`<span class="colh" style="left:${X[k]}px">${h}</span>`).join('');
 return `<div class="map" role="group" aria-label="结构图"><div class="map-in" style="width:${Wd}px;height:${H}px">${heads}<svg class="cn" width="${Wd}" height="${H}" aria-hidden="true">${paths}</svg>${nodesH}</div></div>`;
}
function Outline(v,list,o){
 o=o||{};
 const ns=o.charter?list:treeNodes(v);
 const exp=o.charter?3:S.ui.expand;
 const out=[];let hideUnder=null;
 let k=0;
 ns.forEach(n=>{
  if(n.lv>exp)return;
  if(hideUnder&&n.id.startsWith(hideUnder+'.'))return; hideUnder=null;
  const st=n.lv===3||n.st==='draft'?n.st:rollStatus(v,n,o.charter?ns:null);
  const col=!o.charter&&S.ui.collapsed[v+n.id];
  if(col)hideUnder=n.id;
  const dim=!o.charter&&!matchFilter(n,v);
  const sel=S.ui.sel&&S.ui.sel.v===v&&S.ui.sel.id===n.id;
  const ttl=`<span class="tt${n.asm?' asm':''}" data-edit="${o.charter?'':n.id}" data-v="${v}">${esc(n.t)}${n.asm?'<sup>假设</sup>':''}</span>`;
  const act=o.charter||n.ghost?'':`data-act="node" data-v="${v}" data-id="${n.id}"`;
  const cls=`ol-r l${n.lv}${isWait(st)&&n.lv===3?' wait':''}${dim?' dim':''}${sel?' sel':''}${n.ghost?' ghost':''}${o.anim?' enter':''}`;
  const style=`padding-left:${4+16*n.lv}px;${o.anim?`animation-delay:${k*40}ms`:''}`;
  k++;
  if(n.lv<3){
   const ls=(o.charter?ns:nodesOf(v)).filter(x=>x.lv===3&&(n.id==='0'||x.id.startsWith(n.id+'.'))&&x.st!=='cut');const dn=ls.filter(x=>x.st==='done').length;
   out.push(`<div class="${cls}" style="${style}" role="treeitem" aria-level="${n.lv+1}"><span>${n.lv&&!o.charter?`<button class="car" data-act="collapse" data-k="${v+n.id}" aria-label="${col?'展开':'收起'} ${n.id}" aria-expanded="${!col}">${col?'▸':'▾'}</button>`:smk(st)}</span><button class="ttl" ${act} style="text-align:left"><span class="mono i3">${n.id==='0'?'L0':n.id}</span>${ttl}<span class="ld"></span></button><span class="mono i3">${st==='draft'?`待拆解 · ${rng(n.est[0],n.est[1],0)}`:`${dn} / ${ls.length}`}</span></div>`);
  }else{
   const money=o.charter||!n.cost?(n.est?`预估 ${rng(n.est[0],n.est[1])}`:''):`${usd(n.cost)} 实计`;
   out.push(`<button class="${cls}" style="${style}" ${act} data-nid="${n.id}" ${n.lv===3?`data-tip="${esc(nodeTip(v,n))}"`:''} role="treeitem" aria-level="4" aria-label="${esc(n.id+' '+n.t+' · '+stText(n,v))}">${smk(st)}<span class="ttl"><span class="mono i3">${n.id}</span>${ttl}${st==='running'?`<span class="mono" data-live="pct|${v}|${n.id}">${n.pct}%</span>`:''}${isWait(st)?KindTag({question:'q',approval:'approve',review:'review'}[st]):''}${st==='stuck'?KindTag('stuck'):''}${n.red?'<span class="kt risk">红线</span>':''}<span class="ld"></span></span><span class="cols3"><span class="hm">${RoleMark('工','sm')} ${n.model?MODELS[n.model]:''}</span><span data-live="${st==='running'?`ocost|${v}|${n.id}`:''}">${money}</span><span class="hm">${esc(n.ev||(n.crit||[]).map(c=>c[1]).filter((x,i,a)=>a.indexOf(x)===i).join(' · '))}</span></span></button>`);
  }
 });
 return `<div class="ol" role="tree" aria-label="大纲">${out.join('')}</div>`;
}

function Chart(o){

 const pts=o.cum.map((v,i)=>`${cx(i).toFixed(1)},${cy(v).toFixed(1)}`);
 const li=o.cum.length-1;
 const band=`M${cx(li)},${cy(o.cum[li])} L${cx(n-1)},${cy(o.band[1])} L${cx(n-1)},${cy(o.band[0])} Z`;
 const ticks=o.yt.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${cy(v)}" y2="${cy(v)}" stroke="var(--rule)"/><text x="${L-8}" y="${cy(v)+4}" text-anchor="end">$${v}</text>`).join('');

 const data=JSON.stringify({d:o.days.slice(0,o.cum.length),c:o.cum.map(v=>Math.round(v*100)/100),L,W,Rr,n,T,H,B,ymax:o.ymax});

 <path d="${band}" fill="var(--ink)" fill-opacity=".1"/><text x="${cx(n-1)}" y="${cy(o.band[1])-6}" text-anchor="end">预估 $${o.band[0]}–${o.band[1]}</text>
 <line x1="${cx(li)}" x2="${cx(li)}" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-dasharray="2 3"/><text x="${cx(li)+4}" y="${T+10}">今天</text>

 <rect class="hit" x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="transparent"/></svg></div>`;
}

function liveVal(k){

 switch(a){
  case 'today':return usd(today());
  case 'month':return usd(monthTotal());
  case 'fc':{const f=forecast();return `$${f[0]}–${f[1]}`}
  case 'avg':return usd(avg7());
  case 'ctot':return usd(companyTotal());
  case 'wk':return String(weekAccepted());
  case 'deskn':return String(desk().length);
  case 'trin':return String(S.d.ideas.filter(i=>i.state==='triage').length);
  case 'pct':{const n=node(b,c);return n?`${n.pct}%`:''}
  case 'cost':{const n=node(b,c);return n?usd(n.cost):''}
  case 'ocost':{const n=node(b,c);return n?`${usd(n.cost)} 实计`:''}
  case 'el':{const n=node(b,c);return n?`${Math.max(1,Math.round((nowMs()-n.start)/6e4))} 分钟`:''}
  case 'vsp':return usd(vSpent(b));
  case 'vrem':{const r=remain(b);return rng(r[0],r[1],0)}
  case 'bym':return usd(byModel(b));
  case 'bymt':return usd(['sonnet','opus','codex','haiku'].reduce((x,m)=>x+byModel(m),0));
  case 'byt':return usd(byTeam(b));
  case 'bytt':return usd(byTeam('cc')+byTeam('codex')+byTeam('inh'));
  case 'byr':return usd(byRole(b));
  case 'byrt':return usd(['幕','规','工','检'].reduce((x,r)=>x+byRole(r),0));
  case 'standfirst':return standfirst();
  case 'cest':{const c2=S.d.charters[b];return CH(b).est[Math.min(c2?c2.step:0,3)]}
 }
 return null;
}

function classify(text,toks){
 const t=(text||'').trim();
 const o=S.ui.override;
 if(o)return {kind:o.kind,v:o.v,chip:o.kind==='merge'?`并入 ${S.d.V[o.v].short}`:o.kind==='charter'?'立项':'存档',over:true,food:o.v==='pawlog'&&/粮|快吃完|提醒买/.test(t)};
 const ht=(toks||[]).find(k=>k.t.startsWith('#')); const m=t.match(/^#(\d+(?:\.\d+)*)/);
 if(ht||m){const id=ht?ht.t.slice(1):m[1];let v=ht&&ht.v;if(!v)v=Object.keys(S.d.V).find(k=>node(k,id))||'pawlog';return {kind:'note',v,id,chip:`批注 ${S.d.V[v].short} · ${id}`}}
 if(/汇报|进度|卡在|还能花/.test(t))return {kind:'report',chip:'汇报'};
 const at=(toks||[]).find(k=>k.t.startsWith('@'));
 const am=t.match(/@(\S+)/);
 if(at||am){const nm=at?at.v:Object.keys(S.d.V).find(k=>am[1].startsWith(S.d.V[k].short)||am[1].toLowerCase().startsWith(k));if(nm&&S.d.V[nm])return {kind:'merge',v:nm,chip:`并入 ${S.d.V[nm].short}`,food:nm==='pawlog'&&/粮|快吃完|提醒买/.test(t)}}
 if(/猫|喂|猫粮|pawlog/i.test(t)){const food=/粮|快吃完|提醒买/.test(t);return {kind:'merge',v:'pawlog',food,chip:food?'像是 PawLog 的事 · 靠近 3.2 预测下一次喂食时间':'像是 PawLog 的事'}}
 if(/播客|周报|摘要/.test(t))return {kind:'merge',v:'pod',chip:'像是 播客周报 的事'};
 if(/市集|摊位/.test(t))return {kind:'merge',v:'market',chip:'像是 市集地图 的事'};
 if(/^(感觉|好像|最近)/.test(t)&&t.length<16)return {kind:'archive',chip:'像一句感想 · 建议存档'};
 return {kind:'charter',chip:'像一件新事 · 建议立项'};
}

function applyProposal(){
 const P=S.d.proposal;if(!P)return;const x=S.d.V[P.v];
 const wasStuck=node(P.v,P.nid)&&node(P.v,P.nid).st==='stuck';
 P.ops.forEach(o=>{const n=o.id&&node(P.v,o.id);
  if(o.op==='cut'&&n)n.st='cut';
  if(o.op==='add'&&!node(P.v,o.node.id)){const at=x.nodes.findIndex(k=>k.id===o.after);x.nodes.splice(at+1,0,clone(o.node))}
  if(o.op==='set'&&n)n[o.k]=o.val;
  if(o.op==='unset'&&n)delete n.st;
  if(o.op==='brief')x.brief[o.k]+=o.x;
  if(o.op==='adj'){x.adj[0]+=o.lo;x.adj[1]+=o.hi}
 });
 const Did=logD('修订',`修订 ${P.text}`,P.v,P.nid);
 if(wasStuck&&node(P.v,P.nid).st!=='stuck')S.d.signed.unshift({key:`${P.v}:${P.nid}`,kind:'stuck',title:`${x.short} · ${P.nid} ${node(P.v,P.nid).t}`,mark:'已由修订稿处理',t:hm(),D:Did});
 let i=P.idea&&getIdea(P.idea);
 if(i){i.state='note';i.mode='done';i.tk.push([hm(),'规','规划 · Claude Opus 5.5']);const e=i.rcpt.find(r=>r.blk==='rev');if(e)e.x=`已采纳 · ${Did}`;line(i.id,'你',`采纳修订 · ${Did}`)}
 else{const id='0924-'+pad(S.d.iseq++);S.d.ideas.unshift({id,when:'今天 '+hm(),src:'网页 · 批注',text:P.quote||`#${P.nid} ${P.chip}`,state:'note',tk:[[hm(),'幕','幕僚长 · Claude Opus 5.5'],[hm(),'规','规划 · Claude Opus 5.5']],mode:'done',rcpt:[{t:hm(),g:'你',x:`批注 ${P.nid}：${P.chip}`},{t:hm(),g:'规',x:'按你的批注起草了修订稿'},{t:hm(),g:'你',x:`采纳修订 · ${Did}`}],madeNode:[P.v,P.nid]})}
 S.d.proposal=null;S.ui.noteQuote=null;
 toast('拆解已更新，记进了决策记录');render();
}

/* ============ simulated voice ============ */
let VT=null;
function voiceSpans(raw,fillers){const marks=new Array(raw.length).fill(-1);let from=0;fillers.forEach((f,k)=>{const p=raw.indexOf(f,from);if(p>=0){for(let j=p;j<p+f.length;j++)marks[j]=k;from=p+f.length}});return marks}
function startVoice(where){
 if(S.ui.voice){stopVoice();return}
 if(where==='sheet'&&!(S.ui.sheet&&S.ui.sheet.t==='cap'))S.ui.sheet={t:'cap',showFlow:false};
 const el=document.getElementById('cap-'+where);const base=(el&&el.value!=null?el.value:S.ui.draft[where]||'').trim();
 S.ui.draft[where]=base;S.ui.voiceAttach=null;
 S.ui.voice={where,i:0,base,phase:'rec',marks:voiceSpans(VOICE.raw,VOICE.fillers)};
 render();
 clearInterval(VT);
 if(rm()){S.ui.voice.i=VOICE.raw.length;paintVoice();setTimeout(stopVoice,50);return}
 VT=setInterval(()=>{const v=S.ui.voice;if(!v){clearInterval(VT);return}v.i++;paintVoice();if(v.i>=VOICE.raw.length){clearInterval(VT);setTimeout(stopVoice,250)}},35);
}
function paintVoice(){
 const v=S.ui.voice;if(!v)return;const el=$('#voice-'+v.where);if(!el)return;
 const raw=VOICE.raw;let h=v.base?esc(v.base)+' ':'';let k=0;
 while(k<v.i&&k<raw.length){const m=v.marks[k];if(m>=0){let s='';while(k<v.i&&v.marks[k]===m){s+=raw[k];k++}h+=`<span class="fl" data-f="${m}">${esc(s)}</span>`}else{h+=`<span class="c${k<v.i-6?' s':''}">${esc(raw[k])}</span>`;k++}}
 el.innerHTML=h||'<span class="i3">正在听…</span>';
 const t=$('#vt-'+v.where);if(t)t.textContent='0:'+pad(Math.round(Math.min(1,v.i/raw.length)*VOICE.secs));
}
function stopVoice(){
 const v=S.ui.voice;if(!v||v.phase!=='rec')return;clearInterval(VT);
 v.i=VOICE.raw.length;v.phase='clean';paintVoice();
 const el=$('#voice-'+v.where);
 const fin=()=>{S.ui.draft[v.where]=(v.base?v.base+' ':'')+VOICE.clean;{const f0=document.getElementById('cap-'+v.where);if(f0){f0.value=S.ui.draft[v.where];f0.blur()}}S.ui.voiceAttach={where:v.where,dur:VOICE.dur,raw:VOICE.raw};S.ui.voice=null;render();const f=document.getElementById('cap-'+v.where);if(f){f.focus();try{f.setSelectionRange(f.value.length,f.value.length)}catch(e){}}onCapInput(v.where)};
 if(rm()||!el){fin();return}
 setTimeout(()=>{$$('.fl',el).forEach(s=>s.classList.add('x'))},20);
 setTimeout(()=>{$$('.fl',el).forEach(s=>s.classList.add('gone'))},620);
 setTimeout(()=>{$$('.c',el).forEach(s=>s.classList.add('s'));el.style.transition='opacity .2s';el.style.opacity='.25'},900);
 setTimeout(fin,1120);
}
function onCapInput(where){

let gPending=0;
document.addEventListener('keydown',e=>{
 const t=e.target, tag=t.tagName, inField=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||t.isContentEditable;
 if(t.dataset&&t.dataset.hold&&(e.key===' '||e.key==='Enter')){e.preventDefault();if(rm()){if(!e.repeat)armOrFire(t)}else if(!e.repeat)holdStart(t);return}
 if(inField){
  if(t.dataset.cap){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(t.dataset.cap)}else if(e.key==='Escape'){t.blur()}else if(e.key==='Backspace'&&!t.value&&S.ui.tokens.length){S.ui.tokens.pop();render();const f=$('#'+t.id);if(f)f.focus()}return}
  if(t.id==='note-in'&&e.key==='Enter'){e.preventDefault();sendNote()}
  if(t.dataset.nstitle&&e.key==='Enter'){e.preventDefault();t.blur()}
  if(t.dataset.nstitle&&e.key==='Escape'){const n=node(t.dataset.v,t.dataset.nstitle);if(n)t.value=n.t;t.blur()}
  if(t.dataset.brief&&e.key==='Enter'){e.preventDefault();t.blur()}
  if(e.key==='Escape'&&S.ui.sheet)closeSheet();
  return;
 }
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusCapture();return}
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key;
 if(gPending&&Date.now()-gPending<1500){gPending=0;const m={s:'sign',b:'biz',i:'inbox',l:'ledger',t:'team'}[k.toLowerCase()];if(m){e.preventDefault();go(m);return}}
 if(k==='Escape'){if(S.ui.menu){S.ui.menu=null;renderOv();return}if(S.ui.sheet){closeSheet();return}if(S.ui.readerOpen){S.ui.readerOpen=false;render()}return}
 if(k==='/'){e.preventDefault();focusCapture();return}
 if(k==='?'){S.ui.sheet={t:'keys'};render();return}
 if(k==='g'||k==='G'){gPending=Date.now();return}
 if(k==='m'||k==='M'){e.preventDefault();const hr=$('#hero');const hv=hr&&hr.getBoundingClientRect().bottom>60&&hr.getBoundingClientRect().top<innerHeight;const w=phone()?'sheet':S.ui.sheet&&S.ui.sheet.t==='cap'?'sheet':S.ui.route.n==='brief'&&hv?'hero':'bar';if(S.ui.voice){stopVoice();return}startVoice(w);return}
 if(k==='u'||k==='U'){doUndo();return}
 const r=S.ui.route.n;
 const inTree=r==='venture'&&(S.ui.route.tab||'tree')==='tree';
 if(inTree&&(k==='ArrowDown'||k==='ArrowUp')){
  e.preventDefault();const ids=$$('#app [data-act="node"][data-nid]').map(b=>b.dataset.nid);if(!ids.length)return;
  const cur=S.ui.sel&&S.ui.sel.v===S.ui.route.id?ids.indexOf(S.ui.sel.id):-1;const nx=ids[Math.max(0,Math.min(ids.length-1,cur+(k==='ArrowDown'?1:-1)))];
  S.ui.sel={v:S.ui.route.id,id:nx};if(S.ui.sheet&&S.ui.sheet.t==='node')S.ui.sheet={t:'node'};render();const b=$(`#app [data-nid="${CSS.escape(nx)}"]`);if(b){b.focus({preventScroll:false})}return}
 if(inTree&&k==='Enter'&&S.ui.sel&&!(t.tagName==='BUTTON'&&!t.dataset.nid)){e.preventDefault();openNode(S.ui.sel.v,S.ui.sel.id);return}
 if((k==='n'||k==='N')&&(inTree||S.ui.sheet&&S.ui.sheet.t==='node')&&S.ui.sel){e.preventDefault();if(!S.ui.sheet)openNode(S.ui.sel.v,S.ui.sel.id);setTimeout(()=>{const t=$('#note-in');if(t)t.focus()},40);return}
 if(r==='charter'&&/^[1-3]$/.test(k)){const c=S.d.charters[S.ui.route.id];if(c&&c.phase==='q'){charterAnswer(S.ui.route.id,+k-1);render()}return}
 const docPage=r==='brief'||r==='sign'||(S.ui.sheet&&S.ui.sheet.t==='node');
 if(!docPage)return;
 if((k==='j'||k==='J'||k==='ArrowRight')&&!S.ui.sheet){navDoc(1);return}
 if((k==='k'||k==='K'||k==='ArrowLeft')&&!S.ui.sheet){navDoc(-1);return}
 const key=currentDocKey();if(!key)return;const dv=docView(key);if(!dv)return;
 if(/^[1-3]$/.test(k)&&dv.opts&&dv.opts[+k-1]){S.ui.opt[key]=+k-1;render();return}
 if(k==='Enter'&&tag!=='BUTTON'){if(dv.sign&&!dv.sign.hold&&!dv.primary){e.preventDefault();sign(key,{ctx:S.ui.sheet?'sheet':r==='sign'?'reader':'stack'})}return}
 if((k==='r'||k==='R')&&dv.ret){S.ui.ret[key]=true;render();setTimeout(()=>{const x=document.getElementById('ret-'+key);if(x)x.focus()},20);return}
 if(k==='l'||k==='L'){later(key);return}
});

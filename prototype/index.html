<title>Sprout 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#F6F6F4;--surface:#FFFFFF;--sunk:#EEEEEB;--ink:#0C0D10;--ink-2:#474A53;--muted:#8A8D96;--line:#E3E3E0;--line-2:#ECECE9;
  --signal:#EC5B13;--signal-ink:#FFFFFF;--signal-soft:#FCEBE1;--ok:#1E7A4C;
  --shadow-1:0 1px 2px rgba(12,13,16,.04),0 10px 30px -12px rgba(12,13,16,.12);
  --shadow-2:0 2px 6px rgba(12,13,16,.05),0 30px 80px -24px rgba(12,13,16,.28);
  --f-sans:"Geist","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B0C0F;--surface:#15171B;--sunk:#1C1F24;--ink:#F2F2EF;--ink-2:#B8BBC3;--muted:#7E828C;--line:#272A31;--line-2:#1F2227;
  --signal:#FF7A3D;--signal-ink:#0B0C0F;--signal-soft:#2F1B11;--ok:#5CC28C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.4),0 30px 80px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0C0F;--surface:#15171B;--sunk:#1C1F24;--ink:#F2F2EF;--ink-2:#B8BBC3;--muted:#7E828C;--line:#272A31;--line-2:#1F2227;
  --signal:#FF7A3D;--signal-ink:#0B0C0F;--signal-soft:#2F1B11;--ok:#5CC28C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.4),0 30px 80px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
.display{font-size:clamp(30px,4.4vw,48px);font-weight:300;letter-spacing:-.025em;line-height:1.12}
.h1{font-size:clamp(26px,3.2vw,36px);font-weight:400;letter-spacing:-.02em}
.h2{font-size:20px;font-weight:500}
.h3{font-size:15px;font-weight:500}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.label.you{color:var(--signal)}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px;border-right:1px solid var(--line-2)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-bottom:18px}
.ri{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.ri:hover{background:var(--sunk);color:var(--ink)}
.ri.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.ri .dotn{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--signal);color:var(--signal-ink);font:500 10px/16px var(--f-mono);text-align:center}
.ri .av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:500;color:#fff}
.ri[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:4px 9px;border-radius:7px;white-space:nowrap;z-index:30;pointer-events:none}
.rail hr{width:24px;border:none;border-top:1px solid var(--line);margin:8px 0}
.rail .sp{flex:1}
main{min-width:0;padding-inline:clamp(16px,4vw,56px);padding-block:40px 160px}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:44px}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;transition:transform .15s var(--ease),background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{box-shadow:0 6px 20px -6px var(--ink)}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--ink-2)}
.btn.ghost{color:var(--ink-2);padding:0 12px}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.youpill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--signal-soft);color:var(--signal);font-size:12.5px;font-weight:500;white-space:nowrap}
.youpill b{font-family:var(--f-mono);font-weight:500}

/* status glyphs */
.g{width:18px;height:18px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font:500 10.5px/1 var(--f-mono)}
.g-you{background:var(--signal);color:var(--signal-ink)}
.g-done{background:var(--ink);color:var(--bg)}
.g-run{border:2px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
.g-idle{border:1.5px solid var(--muted)}
.g-draft{border:1.5px dashed var(--muted)}
.g-cut{border:1.5px solid var(--line);position:relative}
.g-cut::after{content:"";position:absolute;width:12px;height:1.5px;background:var(--muted);transform:rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.stxt{font-size:12px;color:var(--muted);white-space:nowrap}
.stxt.you{color:var(--signal)}

/* ---------- today ---------- */
.hero{display:flex;flex-direction:column;gap:14px;max-width:760px}
.hero .sub{font-size:17px;color:var(--ink-2);font-weight:300;line-height:1.7}
.hero .sub b{font-weight:500;color:var(--ink)}
.hero .sub em{font-style:normal;color:var(--signal);font-weight:500}

.deck{display:flex;flex-direction:column;gap:16px}
.deck-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .3s var(--ease),background .3s}
.pips i.on{width:22px;background:var(--signal)}
.nav2{display:flex;gap:4px}
.nav2 button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.nav2 button:hover{border-color:var(--ink-2)}
.stage{position:relative;padding-bottom:20px}
.stage::before,.stage::after{content:"";position:absolute;left:24px;right:24px;top:0;bottom:0;border-radius:24px;background:var(--surface);border:1px solid var(--line-2);z-index:0}
.stage::before{top:10px;bottom:10px;left:14px;right:14px;opacity:.8}
.stage::after{top:20px;bottom:0;left:30px;right:30px;opacity:.45}
.stage.single{padding-bottom:0}
.stage.single::before,.stage.single::after{display:none}
.dcard{position:relative;z-index:1;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-2);padding:clamp(22px,3.4vw,40px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);animation:cardIn .45s var(--ease) both}
.dcard.solo{grid-template-columns:minmax(0,1fr)}
.dcard.leave{animation:cardOut .24s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateX(-40px) rotate(-1.5deg)}}
.dmain{display:flex;flex-direction:column;gap:18px;min-width:0}
.dtitle{font-size:clamp(22px,2.6vw,30px);font-weight:400;letter-spacing:-.02em;line-height:1.3}
.dmeta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dmeta b{color:var(--ink);font-weight:500}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .g{margin-top:3px;width:16px;height:16px;font-size:9px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,transform .15s var(--ease)}
.choice:hover{border-color:var(--ink);transform:translateX(2px)}
.choice .k{width:24px;height:24px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--ink-2);flex:none}
.choice .t{flex:1;min-width:0}
.choice .s{font-size:12.5px;color:var(--muted);white-space:nowrap}
.choice .s.rec{color:var(--signal)}
.figure{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.bignums{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bignum{display:flex;flex-direction:column;gap:2px}
.bignum .v{font-size:clamp(26px,3.2vw,38px);font-weight:300;letter-spacing:-.03em;line-height:1.1}
.bignum .l{font-size:12.5px;color:var(--muted)}
.tasklist{display:flex;flex-direction:column;border-top:1px solid var(--line-2);align-self:start}
.tasklist div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.done-state{background:var(--surface);border-radius:24px;box-shadow:var(--shadow-1);padding:48px 32px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:cardIn .45s var(--ease) both}
.done-state .g{width:44px;height:44px;font-size:20px}

.section{display:flex;flex-direction:column;gap:18px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;min-width:0}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-1);border-color:var(--line)}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pcard .vis{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .now{font-size:13px;display:flex;gap:8px;align-items:center;min-width:0}
.pcard .now span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:14px;gap:8px;margin-top:auto}
.ring{flex:none}
.ring text{font:500 12px var(--f-mono);fill:var(--ink)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.night{display:flex;flex-direction:column}
.night div{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-2);align-items:baseline;font-size:14px}
.night time{font:12.5px var(--f-mono);color:var(--muted)}

/* ---------- project ---------- */
.phead{display:flex;flex-direction:column;gap:22px}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.metrics{display:flex;gap:clamp(20px,4vw,52px);flex-wrap:wrap;align-items:flex-end}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .v{font-size:clamp(24px,2.8vw,32px);font-weight:300;letter-spacing:-.03em;line-height:1.1}
.metric .v small{font-size:14px;color:var(--muted);letter-spacing:0}
.metric .l{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:0 0 12px;color:var(--muted);font-weight:500;position:relative;white-space:nowrap}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.filters{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.filters button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.filters button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-weight:500}

.mapwrap{background:var(--surface);border:1px solid var(--line-2);border-radius:24px;overflow-x:auto;padding:28px}
.map{position:relative}
.map svg.links{position:absolute;inset:0;overflow:visible}
.map svg.links path{fill:none;stroke:var(--line);stroke-width:1.5;transition:opacity .3s}
.map svg.links path.you{stroke:var(--signal);stroke-opacity:.5}
.colhead{position:absolute;top:0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mn{position:absolute;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .2s,box-shadow .2s,opacity .3s,transform .2s var(--ease)}
.mn:hover{border-color:var(--ink-2);transform:translateY(-1px)}
.mn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.mn .id{font:11px var(--f-mono);color:var(--muted)}
.mn.you{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.mn.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--line),var(--shadow-1)}
.mn.l0{background:var(--ink);color:var(--bg);border-color:var(--ink);height:auto;padding:16px 18px;align-items:flex-start;flex-direction:column;gap:6px}
.mn.l0 .t{white-space:normal;font-size:15px;font-weight:500;line-height:1.45}
.mn.l0 .as{font-size:11.5px;opacity:.6}
.mn.l1 .t{font-weight:500}
.mn.l1{flex-wrap:wrap;height:52px;padding-block:8px;row-gap:0;align-content:center}
.mn .mbar{flex-basis:100%;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden;display:flex;gap:2px;margin-top:6px}
.mn .mbar span{height:100%}
.mn.cut .t{text-decoration:line-through;color:var(--muted)}
.mn.dim,.map path.dim{opacity:.22}
.mn.enter{animation:nodeIn .5s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
@keyframes nodeIn{from{opacity:0;transform:translateX(-12px)}}
.assume{display:inline-block;font-size:11.5px;color:var(--signal);border-bottom:1px dashed var(--signal);line-height:1.4;align-self:flex-start}
.hint{font-size:13px;color:var(--muted);max-width:70ch}

/* drawer */
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(460px,calc(100% - 24px));background:var(--surface);border-radius:24px;box-shadow:var(--shadow-2);z-index:40;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .4s var(--ease);border:1px solid var(--line-2);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dscroll{flex:1;overflow-y:auto;padding:26px 26px 18px;display:flex;flex-direction:column;gap:24px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.xbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.xbtn:hover{background:var(--sunk);color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin:0}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-weight:500;font-size:14px}
.note{padding:14px 16px;border-radius:14px;background:var(--sunk);font-size:13.5px;line-height:1.6}
.note.you{background:var(--signal-soft)}
.note.you b{color:var(--signal)}
.tests{font:12.5px/1.8 var(--f-mono);display:flex;flex-direction:column;min-width:0}
.tests .p{color:var(--ok)}
.log{font:12px/1.8 var(--f-mono);color:var(--ink-2);background:var(--sunk);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.pbar{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ink);border-radius:2px}
.composer{border-top:1px solid var(--line-2);padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:0 0 24px 24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.inputbar{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:5px 5px 5px 14px}
.inputbar input{flex:1;min-width:0;border:none;background:transparent;height:34px;outline:none}
.sendb{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.proposal{border:1px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:cardIn .35s var(--ease) both}
.diff{font:12.5px/1.8 var(--f-mono)}
.diff .a{color:var(--ok)}.diff .d{color:var(--signal)}.diff .m{color:var(--ink-2)}
textarea.soft{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);resize:vertical;min-height:72px}
textarea.soft:focus{outline:2px solid var(--ink);outline-offset:0}

/* phone screenshot */
.shot{width:156px;flex:none;border-radius:22px;border:6px solid #0C0D10;background:#FAFAF8;color:#16171a;padding:14px 10px 12px;font-size:10px;display:flex;flex-direction:column;gap:7px;line-height:1.35;box-shadow:var(--shadow-1)}
.shot .sh{font-weight:600;font-size:12px}
.shot .fld{background:#EFEFEC;border-radius:7px;padding:6px 7px;display:flex;justify-content:space-between}
.shot .cta{background:#0C0D10;color:#fff;border-radius:7px;text-align:center;padding:6px;font-weight:600}
.shot .qr{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;width:72px;align-self:center;margin-block:4px}
.shot .qr span{aspect-ratio:1;background:#16171a}.shot .qr span.o{background:transparent}
.shot .tl{display:flex;gap:6px;border-bottom:1px solid #e6e6e2;padding-bottom:5px}
.shot .tl b{font-family:var(--f-mono);font-weight:400;color:#777}

/* spend */
.meter{display:flex;flex-direction:column;gap:14px}
.mtrack{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.mtrack span{position:absolute;top:0;bottom:0}
.mlegend{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mlegend b{color:var(--ink);font-weight:500;font-family:var(--f-mono)}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:24px;padding:clamp(20px,3vw,30px);display:flex;flex-direction:column;gap:20px;min-width:0;position:relative}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-130%);z-index:2}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}

function deckItems(){
  const out=[], order={review:0,question:1,approval:2,stuck:3,clarify:4};
  for (const p of Object.values(projects)){
    if (p.phase==='clarify'){ out.push({type:'clarify',pid:p.id}); continue; }
    const w=waitingFor(p);
    w.review.forEach(n=>out.push({type:'review',pid:p.id,nid:n.id}));
    w.question.forEach(n=>out.push({type:'question',pid:p.id,nid:n.id}));
    if (w.approval.length) out.push({type:'approval',pid:p.id,nid:w.approval[0].parent});
    w.stuck.forEach(n=>out.push({type:'stuck',pid:p.id,nid:n.id}));
  }
  return out.sort((a,b)=>order[a.type]-order[b.type]);
}

const W=[248,200,212,236], GAP=52, ROW=58, TOP=48, NH=44;
const colX = d => W.slice(0,d).reduce((a,b)=>a+b+GAP,0);
const nodeH = d => d===1?52:NH;
function layoutMap(p){
  const pos={}; let li=0;
  const walk = n => { const d=depth(n,p), k=kids(n.id,p); k.forEach(walk);
    const cy = k.length ? (pos[k[0].id].cy+pos[k[k.length-1].id].cy)/2 : TOP + (li++)*ROW + NH/2;
    pos[n.id]={x:colX(d),cy,d,w:W[Math.min(d,3)]}; };
  walk(p.nodes[0]);
  return {pos,width:colX(3)+W[3],height:TOP+li*ROW};
}
function matchF(st){ return S.filter==='all' || (S.filter==='you'?YOU.includes(st):(st==='running'||st==='queued')); }
function renderMap(p){
  const {pos,width,height}=layoutMap(p);
  const links=[], nodes=[];
  p.nodes.forEach((n,idx)=>{
    const a=pos[n.id], st=statusOf(n,p), d=a.d, dim=!matchF(st)&&d>0;
    if (n.parent){ const b=pos[n.parent], x1=b.x+b.w, y1=b.cy, x2=a.x, y2=a.cy, mx=(x1+x2)/2;
      links.push(`<path class="${YOU.includes(st)?'you':''} ${dim?'dim':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`); }
    let bar='';
    if (d===1){ const ls=leaves(n.id,p).filter(x=>x.status!=='cut'); const seg=(ss,c)=>{const k=ls.filter(x=>ss.includes(x.status)).length;return k?`<span style="width:${k/ls.length*100}%;background:${c}"></span>`:''};
      bar=`<span class="mbar">${seg(['done'],'var(--ink)')}${seg(YOU,'var(--signal)')}${seg(['running','queued'],'var(--muted)')}</span>`; }
    const cls=`${S.sel===n.id?'sel':''} ${S.animateMap?'enter':''}`;
    if (d===0) nodes.push(`<button class="mn l0 ${cls}" style="left:0;top:${a.cy}px;transform:translateY(-50%);width:${a.w}px;--i:0" data-sel="${n.id}"><span class="label" style="color:inherit;opacity:.6">愿景</span><span class="t">${esc(n.title)}</span>${n.assume?`<span class="as">${esc(n.assume)}</span>`:''}</button>`);
    else nodes.push(`<button class="mn l${d} ${YOU.includes(st)?'you':''} ${st==='cut'?'cut':''} ${dim?'dim':''} ${cls}" style="left:${a.x}px;top:${a.cy-nodeH(d)/2}px;width:${a.w}px;--i:${idx}" data-sel="${n.id}" title="${esc(n.title)} · ${STXT[st]}">${glyph(st)}<span class="id">${esc(n.id)}</span><span class="t">${esc(n.title)}</span>${bar}</button>`);
  });
  const heads=['愿景','里程碑','功能','任务'].map((t,i)=>`<span class="colhead" style="left:${colX(i)}px">L${i} ${t}</span>`).join('');
  return `<div class="row between"><div class="filters" role="group" aria-label="筛选">${[['all','全部'],['you','等你'],['active','进行中']].map(([k,t])=>`<button class="${S.filter===k?'on':''}" data-filter="${k}">${t}</button>`).join('')}</div>
    <div class="row" style="gap:16px;font-size:12.5px;color:var(--muted)"><span class="row" style="gap:6px">${glyph('done')}完成</span><span class="row" style="gap:6px">${glyph('running')}进行中</span><span class="row" style="gap:6px">${glyph('review')}等你</span><span class="row" style="gap:6px">${glyph('draft')}待拆解</span></div></div>
  <div class="mapwrap"><div class="map" style="width:${width}px;height:${height}px">${heads}<svg class="links" width="${width}" height="${height}" aria-hidden="true">${links.join('')}</svg>${nodes.join('')}</div></div>
  <p class="hint">只有 L3 任务会交给 AI 执行，上层的进度由下层汇总。点任意节点看详情，也可以告诉 AI 这里怎么改。</p>`;
}

    const ls=leaves(n.id,p).filter(x=>x.status!=='cut');
    body+=`<dl class="kv"><div><dt>已验收</dt><dd class="mono">${ls.filter(x=>x.status==='done').length} / ${ls.length}</dd></div><div><dt>已花费</dt><dd class="mono">${money(sumCost(n.id,p))}</dd></div></dl>

    if (st==='stuck') body+=`<div class="note you"><b>卡住了。</b>${esc(n.stuck)}</div><div class="choices">${n.fixes.map((f,i)=>`<button class="choice" data-a="fix" data-pid="${p.id}" data-nid="${n.id}" data-i="${i}"><span class="k">${i+1}</span><span class="t">${esc(f.t)}</span><span class="s ${f.rec?'rec':''}">${f.s}</span></button>`).join('')}</div>`;
    if (st==='question') body+=`<div class="note you"><b>${esc(n.q.t)}</b><br>${esc(n.q.why)}</div><div class="choices">${n.q.o.map((o,i)=>`<button class="choice" data-a="answer" data-pid="${p.id}" data-nid="${n.id}" data-i="${i}"><span class="k">${i+1}</span><span class="t">${esc(o)}</span><span class="s ${i===n.q.def?'rec':''}">${i===n.q.def?'AI 的默认':''}</span></button>`).join('')}</div>`;
    if (st==='approval') body+=`<div class="note you"><b>在下一批里。</b>批准后开始，完成后提供${esc(n.evPlan)}。</div><div class="row"><button class="btn pri sm" data-a="approve" data-pid="${p.id}" data-mode="all">批准这一批</button></div>`;
    if (st==='running') body+=`<div style="display:flex;flex-direction:column;gap:10px"><div class="row between"><span class="h3">正在执行</span><span class="mono muted">${n.progress}%</span></div><div class="pbar"><span style="width:${n.progress}%"></span></div><div class="log">${(n.log||[]).map(esc).join('<br>')}</div></div>`;
    body+=`<dl class="kv"><div><dt>模型</dt><dd>${esc(n.model||'自动选择')}</dd></div><div><dt>${n.cost?'已花费':'预计花费'}</dt><dd class="mono">${n.cost?money(n.cost):esc(n.est||'—')}</dd></div><div><dt>用时</dt><dd>${esc(n.time||n.mins||'—')}</dd></div><div><dt>${n.tok?'Tokens':'证据'}</dt><dd class="mono">${n.tok?n.tok+'k':esc(n.evPlan||'—')}</dd></div></dl>`;
    if (n.crit) body+=`<div style="display:flex;flex-direction:column;gap:12px"><span class="h3">验收标准</span><ul class="checks">${n.crit.map(c=>`<li>${st==='done'||st==='review'?'<span class="g g-done">✓</span>':'<span class="g g-idle"></span>'}<span>${esc(c)}</span></li>`).join('')}</ul></div>`;
    if (n.ev) body+=`<div style="display:flex;flex-direction:column;gap:12px"><span class="h3">完成证据</span><div class="figure" style="justify-content:flex-start">${n.ev.screen?mockScreen(n.ev.screen):''}${testsBlock(n.ev)}</div></div>`;
    if (st==='review') body+= S.rejecting

  requestAnimationFrame(()=>dr.classList.add('open'));

function makeProposal(kind,n,p){
  const d=depth(n,p);
  if (kind==='split') return d>=3 ? {id:n.id,kind,summary:'拆成两个更小的任务。AI 每次只做一件事，失败了重做也便宜。',diff:[['d',`${n.id} ${n.title}`],['a',`${n.id}a ${n.title} · 核心逻辑`],['a',`${n.id}b ${n.title} · 边界情况和测试`],['m','成本 +$0.30，成功率约 78% → 90%']]}
    : {id:n.id,kind,summary:'在这一层下面加两个子节点。',diff:[['a',`${n.title} · 最小版本`],['a',`${n.title} · 完善和测试`]]};
  if (kind==='alt') return {id:n.id,kind,summary:'换一种做法：用成熟的现成服务，不自己写。',diff:[['m',`${n.title} → ${n.title}（用现成服务）`],['m','验收标准不变'],['m','成本约 −20%，多一个外部依赖']]};
  if (kind==='cheap') return {id:n.id,kind,summary:'换成更便宜的模型，适合逻辑简单的任务。',diff:[['m',`${n.model||'Claude Sonnet 5'} → Claude Haiku 4.5`],['m','成本约 −60%'],['d','复杂逻辑一次做对的概率会下降']]};
  if (kind==='cut') return {id:n.id,kind,summary:'先搁置这个节点和下面的任务，以后可以恢复。',diff:[['d',`${n.id} ${n.title}（${leaves(n.id,p).length} 个任务）`],['m','预计还需的花费相应减少']]};
  const txt=($('#adjIn')?.value||'').trim(); if(!txt) return null;
  return {id:n.id,kind,txt,summary:`AI 的理解：“${txt}”。会在这里加一个任务，并补上验收标准。`,diff:[['a',`新任务：${txt}`],['m','写入项目上下文']]};
}
function applyProposal(p){
  const pr=S.proposal, n=node(pr.id,p);
  if (pr.kind==='split' && depth(n,p)>=3){ const i=p.nodes.indexOf(n), base={model:n.model,crit:n.crit,status:n.status==='done'?'done':'ready',est:'$0.6–1.0'};
    p.nodes.splice(i,1,N(n.id+'a',n.parent,n.title+' · 核心逻辑',{...base}),N(n.id+'b',n.parent,n.title+' · 边界情况和测试',{...base})); S.sel=n.id+'a'; }
  else if (pr.kind==='split'){ const c=kids(n.id,p).length; p.nodes.push(N(`${n.id}.${c+1}`,n.id,n.title+' · 最小版本'),N(`${n.id}.${c+2}`,n.id,n.title+' · 完善和测试')); }
  else if (pr.kind==='alt') n.title+='（用现成服务）';
  else if (pr.kind==='cheap') leaves(n.id,p).forEach(l=>{ if(l.status!=='done') l.model='Claude Haiku 4.5'; });
  else if (pr.kind==='cut') leaves(n.id,p).forEach(l=>{ if(l.status!=='done') l.status='cut'; });
  else { const pid = depth(n,p)<3 ? n.id : n.parent, c=kids(pid,p).length; p.nodes.push(N(`${pid}.${c+1}`,pid,pr.txt,{status:'ready',model:'自动选择',est:'估算中'})); }
  logD(p,`调整 ${pr.id}：${pr.summary}`); S.proposal=null; toast('地图已更新，并记进了项目上下文');
}

const cx=i=>CH.L+(CH.W-CH.L-CH.R)*i/(CH.days-1), cy=v=>CH.T+(CH.H-CH.T-CH.B)*(1-v/CH.max);

    ${[[0,'09-10'],[7,'09-17'],[14,'09-24'],[21,'10-01']].map(([i,t])=>`<text x="${cx(i)}" y="${CH.H-8}" text-anchor="middle">${t}</text>`).join('')}
    <line x1="${CH.L}" x2="${CH.W-CH.R}" y1="${cy(p.budget)}" y2="${cy(p.budget)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <text x="${CH.W-CH.R}" y="${cy(p.budget)-7}" text-anchor="end">预算 $${p.budget}</text>
    <path d="M${cx(L)},${cy(18.4)} L${cx(E)},${cy(49.4)} L${cx(E)},${cy(40.4)} Z" fill="var(--sunk)" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${cx(E)}" y="${cy(49.4)-9}" text-anchor="end">预计 $40–49</text>
    <path d="M${pts.join(' L')} L${cx(L)},${cy(0)} L${cx(0)},${cy(0)} Z" fill="var(--ink)" fill-opacity=".06"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${cx(L)}" cy="${cy(18.4)}" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2.5"/>
    <line id="xh" x1="0" x2="0" y1="${CH.T}" y2="${CH.H-CH.B}" stroke="var(--ink-2)" opacity="0"/><circle id="xd" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <rect id="hit" x="${CH.L}" y="${CH.T}" width="${CH.W-CH.L-CH.R}" height="${CH.H-CH.T-CH.B}" fill="transparent"/></svg><div class="tip" id="tip" hidden></div></div>`;
}
function bindChart(){
  const box=$('#spendChart'); if(!box) return; const svg=box.querySelector('svg'), tip=box.querySelector('#tip'), xh=svg.querySelector('#xh'), xd=svg.querySelector('#xd'), hit=svg.querySelector('#hit');
  hit.addEventListener('pointermove',e=>{ const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*CH.W/r.width;
    const i=Math.max(0,Math.min(SPEND.length-1,Math.round((px-CH.L)/(CH.W-CH.L-CH.R)*(CH.days-1))));
    xh.setAttribute('x1',cx(i)); xh.setAttribute('x2',cx(i)); xh.setAttribute('opacity',1); xd.setAttribute('cx',cx(i)); xd.setAttribute('cy',cy(SPEND[i])); xd.setAttribute('opacity',1);
    tip.innerHTML=`09-${10+i} · 累计 <b>${money(SPEND[i])}</b> · 当天 ${money(i?SPEND[i]-SPEND[i-1]:SPEND[0])}`; tip.hidden=false;
    tip.style.left=(cx(i)/CH.W*r.width)+'px'; tip.style.top=(cy(SPEND[i])/CH.H*r.height)+'px'; });
  hit.addEventListener('pointerleave',()=>{ tip.hidden=true; xh.setAttribute('opacity',0); xd.setAttribute('opacity',0); });
}

  p.nodes=[N('0',null,'一张地图，看清这周附近有哪些市集和摊位',{assume:`假设：${a('form')} · ${a('who')}`}),
    N('1','0','能看到这周的市集'),N('1.1','1','市集数据'),N('1.1.1','1.1',a('data'),{status:'ready',model:'Claude Sonnet 5',est:'$2–4',crit:['至少 10 个市集','包含时间、地点、摊位']}),
    N('1.2','1','地图'),N('1.2.1','1.2','在地图上标出市集',{status:'ready',model:'Claude Sonnet 5',est:'$3–5',crit:['按日期筛选','点标记看详情']}),
    N('2','0','看摊位'),N('2.1','2','摊位列表'),N('2.1.1','2.1','市集详情和摊位列表',{status:'ready',model:'Claude Haiku 4.5',est:'$1.5–2.5'}),
    N('3','0','分享给朋友',{est:'$4–8'})];
  p.phase='building'; p.repo='github.com/you/market-map'; p.agents=['Claude Code']; p.budget=30; p.eta='10 月 8 日'; p.remain='$11–20';
  CLARIFY_Q.forEach(q=>logD(p,`${q.t} → ${a(q.k)}`));
}

/* inbox */
function triage(t){
  if (/猫|喂|宠物|猫粮/.test(t)) return {kind:'attach',pid:'p1',node:'3',label:'PawLog · 3 到点提醒喂食',why:'提到了猫和喂食'};
  if (/播客|podcast|摘要/i.test(t)) return {kind:'attach',pid:'p2',node:'2',label:'播客周报 · 2 生成摘要邮件',why:'和播客有关'};
  if (/市集|摊位/.test(t)) return {kind:'attach',pid:'p3',node:'0',label:'市集地图 · 补充需求',why:'提到了市集'};
  if (t.length<14) return {kind:'park',label:'先放着',why:'还比较短，等你想清楚再说'};
  return {kind:'new',label:'新项目',why:'和现有项目无关'};
}
function renderInbox(){
  const nNew=ideas.filter(i=>i.state==='new').length;
  const act=i=>{ if(i.state!=='new') return `<span class="muted" style="font-size:13px">${{attached:'已归入',incubating:'已建项目',parked:'放着了'}[i.state]}</span>`;
    const main=i.ai.kind==='attach'?'归入':i.ai.kind==='new'?'建项目':'好';
    return `<div class="row" style="gap:6px"><button class="btn pri sm" data-idea="${i.id}" data-do="${i.ai.kind}">${main}</button>${i.ai.kind!=='new'?`<button class="btn ghost sm" data-idea="${i.id}" data-do="new">建项目</button>`:''}${i.ai.kind!=='park'?`<button class="btn ghost sm" data-idea="${i.id}" data-do="park">放着</button>`:''}</div>`; };
  return `<header class="hero"><span class="label">收集箱</span><h1 class="display">${nNew} 个新想法</h1>
    <p class="sub">AI 已经看过了，建议了该放在哪。你只需要点一下。这周你提了 <b>3 次</b>跟猫有关的想法。</p></header>
  <div class="ilist">${ideas.map(i=>`<div class="irow ${i.state!=='new'?'doneI':''}"><div>
    <div class="src">${i.src.includes('语音')?I.mic14:''}<span>${esc(i.src)} · ${esc(i.at)}</span>${i.dur?`<span class="mono">${i.dur}</span>`:''}</div>
    <p class="txt">${esc(i.text)}</p>
    <div class="sug"><span class="arrow">→</span><b>${esc(i.ai.label)}</b>${i.ai.why?`<span class="muted">${esc(i.ai.why)}</span>`:''}</div></div>${act(i)}</div>`).join('')}</div>`;
}
function ideaAction(id,what){
  const i=ideas.find(x=>x.id===id);
  if (what==='attach'){ i.state='attached'; const p=P(i.ai.pid); logD(p,`收集箱的想法挂到 ${i.ai.node}：${i.text}`); toast(`已归入 ${p.full}`,{t:'去看看',go:p.id}); }
  else if (what==='park'){ i.state='parked'; toast('放着了，下周小结里会再提一次'); }
  else { i.state='incubating'; const pid='p'+(Object.keys(projects).length+1), name=i.text.replace(/[，。,.！!？?].*$/,'').slice(0,10)||'新项目';
    projects[pid]={id:pid,name,full:name,hue:'#6B6F7A',phase:'clarify',qi:0,answers:{},seed:i.text,nodes:[],decisions:[]};
    S.view='project'; S.pid=pid; toast('项目建好了，先回答 3 个问题'); }
}

/* iOS */
function renderIOS(){
  const items=deckItems(), rev=node('2.1.1',P('p1'));
  const lbl={review:'验收',question:'回答',approval:'批准',stuck:'AI 卡住',clarify:'新项目'};
  return `<header class="hero"><span class="label">iOS</span><h1 class="display">口袋里的遥控器</h1>
    <p class="sub">手机只做三件事：随时记想法，处理等你的事，看 demo 验收。改地图、调模型这些在网页上做。</p></header>
  <div class="phones">
    <div><div class="phone"><div class="island"></div><div class="pbody">
      <div class="ptitle">记一下</div>
      <button class="bigmic ${S.phoneRec?'rec':''}" id="phoneMic" aria-label="开始说话">${S.phoneRec?WAVE.replace('class="wave"','class="wave" style="color:currentColor"'):I.mic40}</button>
      <p class="pcap">${S.phoneRec?'正在听…':'点一下开始说话<br>锁屏小组件和操作按钮也能用'}</p>
      ${ideas.slice(0,3).map(i=>`<div class="pitem"><span>${esc(i.text.length>26?i.text.slice(0,26)+'…':i.text)}<small>${esc(i.at)} · ${i.state==='new'?'→ '+esc(i.ai.label.split(' · ')[0]):'已处理'}</small></span></div>`).join('')}
    </div></div><div class="plabel">记想法</div></div>
    <div><div class="phone"><div class="island"></div><div class="pbody">
      <div class="ptitle">等你</div><p class="muted" style="font-size:13px;margin-top:-6px">${items.length} 件 · 大约 ${Math.max(1,Math.round(items.length*.6))} 分钟</p>
      ${items.map((it,ix)=>{ const p=P(it.pid), n=it.nid?node(it.nid,p):null; return `<button class="pitem" data-deckgo="${ix}">${glyph(it.type==='clarify'?'question':it.type)}<span>${lbl[it.type]} · ${esc(n?n.title:p.full)}<small>${esc(p.full)}</small></span></button>`; }).join('')||'<p class="pcap">都处理完了</p>'}
    </div></div><div class="plabel">等你处理</div></div>
    <div><div class="phone"><div class="island"></div><div class="pbody">
      <span class="label ${rev.status==='review'?'you':''}">PawLog · ${rev.status==='review'?'等你验收':'已验收'}</span><div class="ptitle" style="font-size:21px">${esc(rev.title)}</div>
      <div style="display:flex;justify-content:center">${mockScreen('invite')}</div>
      <div class="pitem"><span class="g g-done">✓</span><span>11 / 11 测试通过<small>3 条验收标准都覆盖了 · $2.95</small></span></div>
      ${rev.status==='review'?`<div class="row" style="justify-content:center"><button class="btn pri" data-a="accept" data-pid="p1" data-nid="2.1.1">通过</button><button class="btn sec" data-deckgo="0" data-rej="1">打回</button></div>`:'<p class="pcap">下一个任务会自动开始</p>'}
    </div></div><div class="plabel">看 demo 验收</div></div>
  </div>`;
}

/* ================= render & events ================= */
function render(){
  renderRail();
  $('#main').innerHTML = S.view==='today'?renderToday():S.view==='inbox'?renderInbox():S.view==='ios'?renderIOS():renderProject();
  renderDrawer(); bindChart();
  $('#micBtn').innerHTML = S.recording?WAVE:I.mic; $('#micBtn').classList.toggle('rec',S.recording);
  S.animateMap=false;
}
function afterDeck(fn){ const c=$('#dcard'); if(c && !reduced){ c.classList.add('leave'); setTimeout(()=>{ fn(); render(); },230); } else { fn(); render(); } }

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  if (t.id==='themeBtn'){ const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; return; }
  if (d.toast){ $('#toast').hidden=true; if(d.toast==='inbox') Object.assign(S,{view:'inbox',sel:null}); else Object.assign(S,{view:'project',pid:d.toast,tab:'map',sel:null}); return render(); }
  if (d.go){ Object.assign(S,{view:d.go,sel:null,rejecting:false}); return render(); }
  if (d.proj){ Object.assign(S,{view:'project',pid:d.proj,tab:'map',sel:null,filter:'all',proposal:null,rejecting:false}); return render(); }
  if (d.openmap){ Object.assign(S,{view:'project',pid:d.openmap,tab:'map',sel:d.nid||null,filter:'all',rejecting:false}); return render(); }
  if (d.deckgo){ Object.assign(S,{view:'today',deckI:+d.deckgo,rejecting:!!d.rej}); return render(); }
  if (d.deck){ const n=deckItems().length; S.deckI=(S.deckI+ +d.deck+n)%n; S.rejecting=false; return render(); }
  if (d.tab){ S.tab=d.tab; S.sel=null; return render(); }
  if (d.filter){ S.filter=d.filter; S.tab='map'; return render(); }
  if (d.sel){ S.sel=d.sel; S.proposal=null; S.rejecting=false; return render(); }
  if (d.auto){ S.autopilot=d.auto; logD(P(),`自动驾驶改为 ${d.auto}`); toast(`自动驾驶：${d.auto}`); return render(); }
  if (d.strat){ S.strategy=d.strat; return render(); }
  if (d.prop){ const p=P(), pr=makeProposal(d.prop,node(S.sel,p),p); if(!pr){ toast('先写下你想怎么改'); return; } S.proposal=pr; return render(); }
  if (d.cq!=null){ const p=P(); p.answers[CLARIFY_Q[p.qi].k]=+d.cq;
    if (p.qi<CLARIFY_Q.length-1){ p.qi++; return render(); }
    S.generating=true; render(); setTimeout(()=>{ generateTree(p); S.generating=false; S.animateMap=true; render(); toast('目标树生成好了。只做了计划，还没有花钱'); }, reduced?200:1500); return; }
  if (d.idea){ ideaAction(d.idea,d.do); return render(); }
  const inDeck = S.view==='today';
  const run = fn => inDeck ? afterDeck(fn) : (fn(), render());
  switch(d.a){
    case 'accept': return run(()=>A.accept(d.pid,d.nid));
    case 'answer': return run(()=>A.answer(d.pid,d.nid,+d.i));
    case 'approve': return run(()=>A.approve(d.pid,d.mode));
    case 'fix': return run(()=>A.fix(d.pid,d.nid,+d.i));
    case 'reject': { const why=($('#rejTxt')?.value||'').trim(); S.rejecting=false; return run(()=>A.reject(d.pid,d.nid,why)); }
    case 'reject-open': S.rejecting=true; render(); $('#rejTxt')?.focus(); return;
    case 'reject-cancel': S.rejecting=false; return render();
    case 'prop-ok': applyProposal(P()); return render();
    case 'prop-no': S.proposal=null; return render();
    case 'close': S.sel=null; S.proposal=null; return render();
  }
  if (t.id==='micBtn'){
    const inp=$('#capIn');
    if (!S.recording){ S.recording=true; inp.placeholder='正在听…（原型里是模拟转写）'; render();
      clearTimeout(S.recT); S.recT=setTimeout(()=>{ if(!S.recording) return; S.recording=false; inp.value='给猫粮做个库存，快吃完的时候提醒我下单'; inp.placeholder='记下一个想法…'; render(); inp.focus(); },2000); }
    else { S.recording=false; inp.placeholder='记下一个想法…'; render(); }
    return;
  }
  if (t.id==='phoneMic' && !S.phoneRec){ S.phoneRec=true; render(); setTimeout(()=>{ S.phoneRec=false; const txt='市集地图加一个下雨取消的提醒'; ideas.unshift({id:'i'+Date.now(),src:'iPhone 语音',at:'刚刚',dur:'0:05',text:txt,ai:triage(txt),state:'new'}); render(); toast('记下了，放进了收集箱'); },1800); }
});
$('#capture').addEventListener('submit',e=>{
  e.preventDefault(); const v=$('#capIn').value.trim(); if(!v){ $('#capIn').focus(); return; }
  const ai=triage(v); ideas.unshift({id:'i'+Date.now(),src:'网页',at:'刚刚',text:v,ai,state:'new'}); $('#capIn').value='';
  render(); toast(`记下了 · AI 建议：${ai.label}`,{t:'去收集箱',go:'inbox'});
});
document.addEventListener('change',e=>{ const d=e.target.dataset; if(d.route){ manual[d.route]=e.target.value; toast(`已改用 ${e.target.value}`); } });
document.addEventListener('keydown',e=>{
  if (e.key==='Escape' && S.sel){ S.sel=null; S.proposal=null; render(); return; }
  if (e.target.matches('input,textarea,select')) return;
  if (S.view==='today' && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ const n=deckItems().length; if(!n) return; S.deckI=(S.deckI+(e.key==='ArrowRight'?1:-1)+n)%n; S.rejecting=false; render(); }
  if (S.view==='today' && /^[1-3]$/.test(e.key)){ document.querySelectorAll('#dcard .choice')[+e.key-1]?.click(); }
  if (e.key==='/'){ e.preventDefault(); $('#capIn').focus(); }
});
render();
</script>

<title>Sprout 原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F6F7;--panel:#FFFFFF;--ink:#16181C;--ink2:#5B616B;--line:#E2E4E8;--accent:#2F5BEA;--accent-soft:#E8EEFD;--ok:#1F8A4C;--warn:#B26A00;
  --y:#FFF6D6;--b:#E6F0FF;--g:#E6F6EC;--p:#F2E9FF;--font:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111317;--panel:#1A1D22;--ink:#ECEEF1;--ink2:#9AA1AC;--line:#2C3038;--accent:#7C9BFF;--accent-soft:#1E2742;--ok:#5CC98A;--warn:#E5A84B;--y:#3A3420;--b:#1F2C44;--g:#1E3528;--p:#2E2542}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111317;--panel:#1A1D22;--ink:#ECEEF1;--ink2:#9AA1AC;--line:#2C3038;--accent:#7C9BFF;--accent-soft:#1E2742;--ok:#5CC98A;--warn:#E5A84B;--y:#3A3420;--b:#1F2C44;--g:#1E3528;--p:#2E2542}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.brand{font-weight:700;font-size:16px;padding:0 8px 14px}
.nl{font-size:12px;color:var(--ink2);padding:12px 8px 4px}
nav button{border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;display:flex;align-items:center;gap:8px}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.run{background:var(--accent)}.dot.wait{background:var(--warn)}
main{padding:20px 24px 40px;min-width:0}
h1{font-size:20px;margin:0 0 4px;font-weight:700}
.sub{color:var(--ink2);margin:0 0 16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* canvas */
.board{position:relative;height:460px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
.card{position:absolute;width:190px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:grab;user-select:none;touch-action:none;font-size:13.5px}
.card.sel{outline:2px solid var(--accent)}
.card small{display:block;color:var(--ink2);font-size:11.5px;margin-top:4px}
.card.y{background:var(--y)}.card.b{background:var(--b)}.card.g{background:var(--g)}.card.p{background:var(--p)}
.cap{display:flex;gap:8px;margin-top:12px}
.cap input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px}
.mic.rec{background:var(--warn);color:#fff;border-color:var(--warn)}
.ask{margin-top:12px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px}
.ask .opt{margin:6px 6px 0 0}
/* project */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--ink2)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.box h2{font-size:15px;margin:0 0 10px}
.goal{font-weight:500;margin:10px 0 4px}
.task{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px}
.task:hover{background:var(--bg)}.task.on{background:var(--accent-soft)}
.task .m{margin-left:auto;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink2);flex:none;display:grid;place-items:center;font-size:10px}
.st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.st.run{border-color:var(--accent);border-top-color:transparent;animation:sp 1s linear infinite}
.st.wait{background:var(--warn);border-color:var(--warn);color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--ink2)}
.steps{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:8px;align-items:center;font-size:13.5px}
.steps li.todo{color:var(--ink2)}
.screen{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;margin-top:8px;min-height:120px;font-size:13px}
.screen .term{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7}
.mock{width:160px;border:5px solid var(--ink);border-radius:18px;background:#fff;color:#16181C;padding:10px;font-size:11px}
.mock .t{font-weight:700;margin-bottom:6px}.mock .f{background:#EEF0F3;border-radius:5px;padding:4px 6px;margin-bottom:5px}.mock .c{background:#2F5BEA;color:#fff;border-radius:5px;text-align:center;padding:4px}
.review{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.note{font-size:12.5px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  .brand,.nl{display:none}
  main{padding:16px}
  .board{height:420px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
}
</style>

<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>

<script>
/* ---------- 示例数据 ---------- */
const S={view:'canvas',sel:new Set(),asking:false,pid:'p1',tid:'t4',rec:false};
let cards=[
 {id:1,x:30,y:30,c:'y',t:'家里人一起记猫吃了没，到点提醒',src:'语音 · 周一'},
 {id:2,x:250,y:60,c:'y',t:'猫粮快吃完时提醒我买',src:'语音 · 今天'},
 {id:3,x:60,y:170,c:'y',t:'别重复喂，也别忘了喂',src:'文字 · 周二'},
 {id:4,x:480,y:40,c:'b',t:'每周一收到我订阅播客的摘要',src:'文字 · 上周'},
 {id:5,x:500,y:170,c:'b',t:'摘要里加“本周值得听”',src:'分享 · 昨天'},
 {id:6,x:300,y:290,c:'g',t:'周末市集地图，看这周哪里有市集',src:'语音 · 昨天'},
 {id:7,x:40,y:330,c:'p',t:'最近咖啡喝太多了',src:'语音 · 昨天'},
];
const projects={
 p1:{name:'PawLog 喂猫记录',spent:12.40,remain:'$14–20',eta:'9 月 30 日',tok:'1.6M',
  goal:'让养猫的家庭一起记录喂食，到点提醒',
  miles:[
   {t:'一个人能记录喂食',tasks:[
     {id:'t1',t:'数据模型与 API',st:'done',m:'Claude Sonnet 5',cost:1.84},
     {id:'t2',t:'记录喂食页面',st:'done',m:'Claude Sonnet 5',cost:2.10}]},
   {t:'家人共享',tasks:[
     {id:'t3',t:'邀请链接与加入流程',st:'done',m:'Claude Sonnet 5',cost:2.95},
     {id:'t4',t:'多台手机实时同步',st:'wait',m:'Codex',cost:2.40}]},
   {t:'到点提醒',tasks:[
     {id:'t5',t:'推送提醒',st:'todo',m:'Claude Sonnet 5',est:'$2.4–3.6'},
     {id:'t6',t:'猫粮余量估算',st:'todo',m:'Claude Haiku 4.5',est:'$1.0–1.6'}]}]},
 p2:{name:'播客周报',spent:4.20,remain:'$3–5',eta:'9 月 27 日',tok:'0.6M',goal:'每周一收到订阅播客的摘要',
  miles:[{t:'抓取与转写',tasks:[{id:'q1',t:'拉取 RSS',st:'done',m:'Claude Haiku 4.5',cost:.9},{id:'q2',t:'音频转文字',st:'done',m:'Claude Sonnet 5',cost:2.1}]},
   {t:'摘要邮件',tasks:[{id:'q3',t:'每集 5 条要点',st:'todo',m:'Claude Sonnet 5',est:'$0.6–1.0'}]}]}
};
const RUN={
 m1:{steps:['读你的卡片','整理成需求','准备数据'],screen:'done',result:'需求和数据已整理'},
 m2:{steps:['搭页面框架','做主页面','截图并跑测试'],screen:'done',result:'主页面可以用了'}, // agent 执行过程（Manus 式）
 t4:{steps:['读项目上下文和代码仓库','写实时订阅的代码','写 6 个测试','在两台模拟手机上跑一遍'],screen:'sync',result:'测试 6/6 通过 · A 手机记录后 1.2 秒出现在 B 手机'},
 t5:{steps:['读项目上下文','接入 APNs 推送','写提醒设置页','截图并跑测试'],screen:'push',result:'测试 5/5 通过 · 到点收到推送'},
 t6:{steps:['读最近 14 天记录','写余量估算','首页加“还够几天”','截图并跑测试'],screen:'food',result:'测试 4/4 通过 · 猫粮还够 5 天'},
 q3:{steps:['读转写稿','每集写 5 条要点','生成邮件预览'],screen:'mail',result:'3 集摘要已生成'},
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2500)}
const P=()=>projects[S.pid];
const topic=()=>{const c=cards.find(x=>S.sel.has(x.id));return c?c.t.split(/[，,]/)[0].slice(0,12):'新项目'};
const allTasks=p=>p.miles.flatMap(m=>m.tasks);
const task=id=>allTasks(P()).find(t=>t.id===id);
const icon=st=>`<span class="st ${st}">${st==='done'?'✓':st==='wait'?'!':''}</span>`;

/* ---------- 导航 ---------- */
function renderNav(){
 const pst=p=>{const ts=allTasks(p);return ts.some(t=>t.st==='wait')?'wait':ts.some(t=>t.st==='run')?'run':''};
 $('#nav').innerHTML=`<div class="brand">Sprout</div>
 <button class="${S.view==='canvas'?'on':''}" data-go="canvas">想法画布</button>
 <div class="nl">项目</div>
 ${Object.entries(projects).map(([id,p])=>`<button class="${S.view==='project'&&S.pid===id?'on':''}" data-p="${id}"><span class="dot ${pst(p)}"></span>${esc(p.name)}</button>`).join('')}`;
}

/* ---------- 画布（Muse 式） ---------- */
function renderCanvas(){
 $('#main').innerHTML=`<h1>想法画布</h1><p class="sub">随手记下的想法都在这里。拖动卡片整理，选中几张，变成一个项目。（示例数据）</p>
 <div class="row" style="margin-bottom:10px"><span class="note">已选 ${S.sel.size} 张</span>
  <button class="btn pri" id="mk" ${S.sel.size?'':'disabled'}>把选中的变成项目</button></div>
 <div class="board" id="board">${cards.map(c=>`<div class="card ${c.c} ${S.sel.has(c.id)?'sel':''}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">${esc(c.t)}<small>${esc(c.src)}</small></div>`).join('')}</div>
 <form class="cap" id="cap"><input id="capIn" placeholder="写下一个想法，或者点麦克风说" aria-label="写下一个想法"><button type="button" class="btn mic ${S.rec?'rec':''}" id="mic">${S.rec?'正在听…':'🎤'}</button><button class="btn pri">记下</button></form>
 ${S.asking?`<div class="ask"><b>AI 想先确认一件事</b><p style="margin:4px 0">这 ${S.sel.size} 张卡片看起来是同一件事：“${esc(topic())}”。第一版做成什么？</p>
  ${['网页','iOS App','微信小程序'].map(o=>`<button class="btn opt" data-ans="${o}">${o}</button>`).join('')}</div>`:''}`;
}

/* ---------- 项目（Manus 式执行 + 项目管理） ---------- */
function renderProject(){
 const p=P(), ts=allTasks(p), done=ts.filter(t=>t.st==='done').length, cur=task(S.tid)||ts[0];
 const wait=ts.filter(t=>t.st==='wait').length;
 const next=ts.find(t=>t.st==='todo');
 $('#main').innerHTML=`<h1>${esc(p.name)}</h1><p class="sub">目标：${esc(p.goal)}</p>
 <div class="stats">
  <div class="stat"><b>${done} / ${ts.length}</b><span>任务完成</span><div class="bar"><i style="width:${done/ts.length*100}%"></i></div></div>
  <div class="stat"><b>$${p.spent.toFixed(2)}</b><span>已花 · ${p.tok} tokens</span></div>
  <div class="stat"><b>${p.remain}</b><span>预计还要花</span></div>
  <div class="stat"><b>${p.eta}</b><span>预计完成</span></div>
  <div class="stat"><b style="color:${wait?'var(--warn)':'inherit'}">${wait?`${wait} 件等你`:'没有卡住'}</b><span>卡在哪</span></div>
 </div>
 <div class="two">
  <div class="box"><h2>计划</h2>
   ${p.miles.map(m=>`<div class="goal">${esc(m.t)}</div>${m.tasks.map(t=>`<button class="task ${t.id===cur.id?'on':''}" data-t="${t.id}">${icon(t.st)}${esc(t.t)}<span class="m">${esc(t.m)} · ${t.cost?'$'+t.cost.toFixed(2):t.est}</span></button>`).join('')}`).join('')}
   <div class="review">${next?`<button class="btn pri" data-start="${next.id}">批准并开始：${esc(next.t)} · 预计 ${next.est}</button>`:'<span class="note">所有任务都开始了</span>'}
   <p class="note" style="margin-top:6px">花钱之前都要你点一下。</p></div>
  </div>
  <div class="box">${agentPanel(cur)}</div>
 </div>`;
}
function agentPanel(t){
 const r=RUN[t.id];
 const head=`<div class="row"><h2 style="margin:0">${esc(t.t)}</h2><span class="chip">${esc(t.m)}</span></div>`;
 if(t.st==='todo')return head+`<p class="note">还没开始。批准后，agent 会在云端一步步做，你能在这里看到过程。</p>`;
 if(t.st==='done')return head+`<p class="note">已完成并验收 · 花了 $${t.cost.toFixed(2)}</p>${screen('done',t)}`;
 const n=t.step??r.steps.length;
 return head+`<ol class="steps">${r.steps.map((s,i)=>`<li class="${i<n?'':'todo'}">${i<n?icon('done'):i===n?icon('run'):icon('')}${esc(s)}</li>`).join('')}</ol>
  <div class="note">agent 的屏幕</div>${screen(t.st==='run'?'term':r.screen,t)}
  ${t.st==='wait'?`<div class="review"><b>做完了，等你验收</b><p class="note" style="margin:2px 0 8px">${esc(r.result)}</p>
   <div class="row"><button class="btn pri" data-ok="${t.id}">通过</button><input id="fix" placeholder="哪里要改？" style="flex:1;min-width:120px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel)"><button class="btn" data-fix="${t.id}">让它改</button></div></div>`:''}`;
}
function screen(kind,t){
 if(kind==='term'){const r=RUN[t.id];return `<div class="screen"><div class="term">$ agent run "${esc(t.t)}"<br>&gt; ${esc(r.steps[Math.min(t.step,r.steps.length-1)])}…</div></div>`}
 const m={sync:['两台手机同步','A 手机：09:12 橘子 40g','B 手机：09:12 橘子 40g ✓','已同步'],push:['提醒','18:30 该喂年糕了','点开直接记录','好的'],food:['今天','下一次喂食 18:30','猫粮还够 5 天','记一次'],mail:['本周播客摘要','《慢慢说》5 条要点','《科技早知道》5 条要点','打开邮件'],done:[t.t,'已完成','截图 · 测试通过','查看']}[kind];
 return `<div class="screen row" style="align-items:flex-start;gap:14px"><div class="mock"><div class="t">${esc(m[0])}</div><div class="f">${esc(m[1])}</div><div class="f">${esc(m[2])}</div><div class="c">${esc(m[3])}</div></div><div class="note">截图由 agent 自动生成<br>（示例）</div></div>`;
}

/* ---------- 执行模拟 ---------- */
function runTask(id){
 const t=task(id);t.st='run';t.step=0;S.tid=id;render();
 const r=RUN[id]||{steps:['执行中'],screen:'done',result:'完成'};RUN[id]=r;
 const tick=()=>{t.step++;if(t.step>=r.steps.length){t.st='wait';t.cost=parseFloat((t.est||'$1').replace(/[^0-9.]/g,''))||1;P().spent+=t.cost;toast('做完了，等你验收');render();return}render();setTimeout(tick,900)};
 setTimeout(tick,900);
}

/* ---------- render & events ---------- */
function render(){renderNav();S.view==='canvas'?renderCanvas():renderProject();bindBoard()}
function bindBoard(){
 const b=$('#board');if(!b)return;
 b.querySelectorAll('.card').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
   const c=cards.find(x=>x.id==el.dataset.id), sx=e.clientX, sy=e.clientY, ox=c.x, oy=c.y; let moved=false;
   el.setPointerCapture(e.pointerId);
   const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    c.x=Math.max(0,Math.min(b.clientWidth-190,ox+dx));c.y=Math.max(0,Math.min(b.clientHeight-60,oy+dy));el.style.left=c.x+'px';el.style.top=c.y+'px'};
   const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);
    if(!moved){S.sel.has(c.id)?S.sel.delete(c.id):S.sel.add(c.id);S.asking=false;render()}};
   el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
  });
 });
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go){S.view='canvas';render()}
 else if(d.p){S.view='project';S.pid=d.p;S.tid=allTasks(P()).find(x=>x.st!=='done')?.id||allTasks(P())[0].id;render()}
 else if(t.id==='mk'){S.asking=true;render()}
 else if(d.ans){
  const picked=cards.filter(c=>S.sel.has(c.id));
  const nm=topic();const pid='p'+Date.now();
  projects[pid]={name:nm,spent:0,remain:'$11–20',eta:'10 月 8 日',tok:'0',goal:nm+'（第一版：'+d.ans+'）',
   miles:[{t:'第一版能用',tasks:[{id:'m1',t:'整理需求和数据',st:'todo',m:'Claude Haiku 4.5',est:'$0.8–1.4'},{id:'m2',t:d.ans+'主页面',st:'todo',m:'Claude Sonnet 5',est:'$2.0–3.2'}]},
    {t:'打磨',tasks:[{id:'m3',t:'细节和边界情况',st:'todo',m:'Claude Sonnet 5',est:'$1.6–2.6'}]}]};
  cards=cards.filter(c=>!S.sel.has(c.id));S.sel.clear();S.asking=false;
  S.view='project';S.pid=pid;S.tid='m1';toast(`已从 ${picked.length} 张卡片生成项目，还没花钱`);render();
 }
 else if(d.t){S.tid=d.t;render()}
 else if(d.start){runTask(d.start)}
 else if(d.ok){const x=task(d.ok);x.st='done';toast('已验收，进度 +1');render()}
 else if(d.fix){const v=($('#fix').value||'').trim();if(!v){toast('先写一下哪里要改');return}toast('已打回，agent 按你的意见重做');runTask(d.fix)}
 else if(t.id==='mic'){if(S.rec)return;S.rec=true;render();setTimeout(()=>{S.rec=false;render();$('#capIn').value='猫粮快吃完时提醒我下单';$('#capIn').focus()},1500)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const v=$('#capIn').value.trim();if(!v)return;

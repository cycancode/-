<title>Sprout 原型</title>
<style>
:root{--bg:#F5F5F7;--panel:#FFFFFF;--ink:#1D1D1F;--ink2:#6E6E73;--line:#E5E5EA;--track:#E8E8ED;--accent:#0071E3;--accent-soft:#E8F1FC;--ok:#34C759;--warn:#FF9F0A;
 --y:#FFF8E1;--b:#EAF3FF;--g:#EAF8EE;--p:#F3EEFF;--shadow:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--panel:#1C1C1E;--ink:#F5F5F7;--ink2:#98989D;--line:#2C2C2E;--track:#3A3A3C;--accent:#2997FF;--accent-soft:#0A2540;--ok:#30D158;--warn:#FF9F0A;--y:#3A3320;--b:#10263F;--g:#10301B;--p:#2A2140;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--panel:#1C1C1E;--ink:#F5F5F7;--ink2:#98989D;--line:#2C2C2E;--track:#3A3A3C;--accent:#2997FF;--accent-soft:#0A2540;--ok:#30D158;--warn:#FF9F0A;--y:#3A3320;--b:#10263F;--g:#10301B;--p:#2A2140;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:28px 14px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line)}
.brand{font-weight:600;font-size:20px;letter-spacing:-.02em;padding:0 10px 22px}
.nl{font-size:12px;font-weight:600;color:var(--ink2);padding:18px 10px 6px}
nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:14px}
nav button:hover{background:var(--track)}
nav button.on{background:var(--accent);color:#fff}
nav button.on .dot{background:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--track);flex:none}
.dot.run{background:var(--accent)}.dot.wait{background:var(--warn)}
main{padding:48px 48px 72px;min-width:0;max-width:1180px}
h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:0 0 8px;font-weight:700}
.sub{color:var(--ink2);font-size:17px;margin:0 0 32px}
.btn{border:0;background:var(--track);border-radius:980px;padding:8px 18px;font-size:14px;font-weight:500;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.board{position:relative;height:480px;background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
 background-image:radial-gradient(var(--track) 1px,transparent 1px);background-size:24px 24px}
.card{position:absolute;width:196px;padding:14px 16px;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.05);cursor:grab;user-select:none;touch-action:none;font-size:14px;font-weight:500;line-height:1.4;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.1)}
.card.sel{box-shadow:0 0 0 3px var(--accent),0 12px 28px rgba(0,0,0,.1)}
.card small{display:block;color:var(--ink2);font-size:12px;font-weight:400;margin-top:6px}
.card.y{background:var(--y)}.card.b{background:var(--b)}.card.g{background:var(--g)}.card.p{background:var(--p)}
.cap{display:flex;gap:10px;margin-top:16px}
.cap input{flex:1;min-width:0;border:0;background:var(--panel);border-radius:980px;padding:12px 20px;box-shadow:var(--shadow);outline:none}
.cap input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.mic{width:46px;padding:0;display:grid;place-items:center}
.mic svg{width:18px;height:18px}
.mic.rec{background:#FF3B30;color:#fff;width:auto;padding:0 18px}
.ask{margin-top:16px;background:var(--panel);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.ask b{font-size:17px}
.ask .opt{margin:10px 8px 0 0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--ink2)}
.bar{height:4px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.box{background:var(--panel);border-radius:22px;padding:24px 26px;box-shadow:var(--shadow)}
.box h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0}
.st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--track);flex:none;display:grid;place-items:center;font-size:10px;font-weight:700}
.st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.st.run{border-color:var(--accent);border-top-color:transparent;animation:sp 1s linear infinite}
.st.wait{background:var(--warn);border-color:var(--warn);color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{font-size:12px;background:var(--track);border-radius:980px;padding:3px 10px;color:var(--ink2)}
.steps{list-style:none;margin:18px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:center}
.steps li.todo{color:var(--ink2)}
.screen{border-radius:16px;background:var(--bg);padding:18px;margin-top:10px;min-height:130px;font-size:13px}
.screen .term{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.8}
.mock{width:168px;border:6px solid #1D1D1F;border-radius:24px;background:#fff;color:#1D1D1F;padding:14px 10px;font-size:11px}
.mock .t{font-weight:600;font-size:13px;margin-bottom:8px}.mock .f{background:#F2F2F7;border-radius:8px;padding:6px 8px;margin-bottom:6px}.mock .c{background:#0071E3;color:#fff;border-radius:980px;text-align:center;padding:5px}
.review{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
.review input{border:0;background:var(--bg);border-radius:980px;padding:8px 16px;outline:none}
.note{font-size:13px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(20px);color:var(--bg);padding:10px 18px;border-radius:980px;font-size:14px;font-weight:500}
/* OKR tree */
.box.treebox{padding:0;overflow:hidden}
.stage{position:relative;overflow-x:auto;padding:44px 28px 36px}
.okr{position:relative;min-width:780px;display:flex;flex-direction:column;align-items:center;gap:52px}
.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.links path{fill:none;stroke:var(--line);stroke-width:1.5}
.links path.ok{stroke:color-mix(in srgb,var(--ok) 55%,transparent)}
.links path.run,.links path.wait{stroke-dasharray:4 6;animation:flow 1.4s linear infinite}
.links path.run{stroke:var(--accent)}.links path.wait{stroke:var(--warn)}
@keyframes flow{to{stroke-dashoffset:-20}}
.onode{position:relative;z-index:1;display:flex;gap:22px;align-items:center;max-width:680px;padding:6px 0;text-align:left}
.onode .lab{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.onode .tx{text-wrap:balance;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.025em;margin-top:4px}
.onode .meta{font-size:14px;color:var(--ink2);margin-top:6px}
.ring text{font-family:var(--font)}
.krs{list-style:none;margin:0;padding:0;display:flex;gap:18px;width:100%;justify-content:center;position:relative;z-index:1}
.krs>li{flex:1;max-width:320px;display:flex;flex-direction:column;gap:22px}
.kr{border-radius:18px;padding:18px 20px 16px;background:var(--bg)}
.kr .hd{display:flex;align-items:center;justify-content:space-between}
.kr .lab{font-size:12px;font-weight:600;color:var(--ink2)}
.kr .stt{font-size:12px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kr .stt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--track)}
.kr.done .stt::before{background:var(--ok)}.kr.wait .stt::before{background:var(--warn)}.kr.run .stt::before{background:var(--accent)}
.kr .t{font-weight:600;font-size:17px;margin:10px 0 2px;letter-spacing:-.02em}
.kr .m{font-size:13px;color:var(--ink2)}
.kr .big{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.kr .big b{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}.kr .big b small{font-size:17px;color:var(--ink2);font-weight:500}
.kr .big span{font-size:13px;color:var(--ink2)}
.kbar{height:4px;border-radius:2px;background:var(--track);margin-top:10px;overflow:hidden}
.kbar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.kr.done .kbar i{background:var(--ok)}.kr.wait .kbar i{background:var(--warn)}
.tks{list-style:none;margin:0;padding:0 0 0 28px;display:flex;flex-direction:column;gap:8px}
.tn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border-radius:12px;padding:10px 12px;font-size:14px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.tn:hover{border-color:color-mix(in srgb,var(--ink2) 50%,transparent)}
.tn.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.tn .c{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
.tn .sd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--track)}
.tn.done .sd{background:var(--ok)}.tn.wait .sd{background:var(--warn)}
.tn.run .sd{background:var(--accent);animation:pl 1.2s ease-in-out infinite}
.tn span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.done span:nth-child(2){color:var(--ink2)}
@keyframes pl{50%{opacity:.3}}
.okr.anim .l0{animation:rise .6s cubic-bezier(.25,.1,.25,1) both}
.okr.anim .l1{animation:rise .6s .2s cubic-bezier(.25,.1,.25,1) both}
.okr.anim .l2{animation:rise .5s calc(.4s + var(--i)*.04s) cubic-bezier(.25,.1,.25,1) both}
.okr.anim .links{animation:fade .6s .6s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
.treefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 26px;border-top:1px solid var(--line)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .brand,.nl{display:none}
  main{padding:28px 16px 48px}
  h1{font-size:30px}.sub{font-size:15px;margin-bottom:22px}
  .board{height:440px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .onode .tx{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>

<script>
/* ---------- 示例数据 ---------- */
const S={seen:new Set(),view:'canvas',sel:new Set(),asking:false,pid:'p1',tid:'t4',rec:false};
let cards=[
 {id:1,x:30,y:30,c:'y',t:'家里人一起记猫吃了没，到点提醒',src:'语音 · 周一'},
 {id:2,x:250,y:60,c:'y',t:'猫粮快吃完时提醒我买',src:'语音 · 今天'},
 {id:3,x:60,y:170,c:'y',t:'别重复喂，也别忘了喂',src:'文字 · 周二'},
 {id:4,x:480,y:40,c:'b',t:'每周一收到我订阅播客的摘要',src:'文字 · 上周'},
 {id:5,x:500,y:170,c:'b',t:'摘要里加“本周值得听”',src:'分享 · 昨天'},
 {id:6,x:300,y:290,c:'g',t:'周末市集地图，看这周哪里有市集',src:'语音 · 昨天'},
 {id:7,x:40,y:330,c:'p',t:'最近咖啡喝太多了',src:'语音 · 昨天'},
];
const projects={
 p1:{name:'PawLog 喂猫记录',spent:12.40,remain:'$14–20',eta:'9 月 30 日',tok:'1.6M',
  goal:'让养猫的家庭不再忘喂，也不再重复喂',
  miles:[
   {t:'一个人能记录喂食',kr:'2 步内记完一次喂食',tasks:[
     {id:'t1',t:'数据模型与 API',st:'done',m:'Claude Sonnet 5',cost:1.84},
     {id:'t2',t:'记录喂食页面',st:'done',m:'Claude Sonnet 5',cost:2.10}]},
   {t:'家人共享',kr:'80% 的家庭邀请到 2 人以上',tasks:[
     {id:'t3',t:'邀请链接与加入流程',st:'done',m:'Claude Sonnet 5',cost:2.95},
     {id:'t4',t:'多台手机实时同步',st:'wait',m:'Codex',cost:2.40}]},
   {t:'到点提醒',kr:'提醒准时率 ≥ 95%',tasks:[
     {id:'t5',t:'推送提醒',st:'todo',m:'Claude Sonnet 5',est:'$2.4–3.6'},
     {id:'t6',t:'猫粮余量估算',st:'todo',m:'Claude Haiku 4.5',est:'$1.0–1.6'}]}]},
 p2:{name:'播客周报',spent:4.20,remain:'$3–5',eta:'9 月 27 日',tok:'0.6M',goal:'每周一 8 点前收到一封 3 分钟读完的播客摘要',
  miles:[{t:'抓取与转写',kr:'覆盖全部订阅源，一集 1 小时内转完',tasks:[{id:'q1',t:'拉取 RSS',st:'done',m:'Claude Haiku 4.5',cost:.9},{id:'q2',t:'音频转文字',st:'done',m:'Claude Sonnet 5',cost:2.1}]},
   {t:'摘要邮件',kr:'每集 5 条要点，每条 ≤ 40 字',tasks:[{id:'q3',t:'每集 5 条要点',st:'todo',m:'Claude Sonnet 5',est:'$0.6–1.0'}]}]}
};
const RUN={
 m1:{steps:['读你的卡片','整理成需求','准备数据'],screen:'done',result:'需求和数据已整理'},
 m2:{steps:['搭页面框架','做主页面','截图并跑测试'],screen:'done',result:'主页面可以用了'}, // agent 执行过程（Manus 式）
 t4:{steps:['读项目上下文和代码仓库','写实时订阅的代码','写 6 个测试','在两台模拟手机上跑一遍'],screen:'sync',result:'测试 6/6 通过 · A 手机记录后 1.2 秒出现在 B 手机'},
 t5:{steps:['读项目上下文','接入 APNs 推送','写提醒设置页','截图并跑测试'],screen:'push',result:'测试 5/5 通过 · 到点收到推送'},
 t6:{steps:['读最近 14 天记录','写余量估算','首页加“还够几天”','截图并跑测试'],screen:'food',result:'测试 4/4 通过 · 猫粮还够 5 天'},
 q3:{steps:['读转写稿','每集写 5 条要点','生成邮件预览'],screen:'mail',result:'3 集摘要已生成'},
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2500)}
const P=()=>projects[S.pid];
const topic=()=>{const c=cards.find(x=>S.sel.has(x.id));return c?c.t.split(/[，,]/)[0].slice(0,12):'新项目'};
const allTasks=p=>p.miles.flatMap(m=>m.tasks);
const task=id=>allTasks(P()).find(t=>t.id===id);
const icon=st=>`<span class="st ${st}">${st==='done'?'✓':st==='wait'?'!':''}</span>`;

/* ---------- 导航 ---------- */
function renderNav(){
 const pst=p=>{const ts=allTasks(p);return ts.some(t=>t.st==='wait')?'wait':ts.some(t=>t.st==='run')?'run':''};
 $('#nav').innerHTML=`<div class="brand">Sprout</div>
 <button class="${S.view==='canvas'?'on':''}" data-go="canvas">想法画布</button>
 <div class="nl">项目</div>
 ${Object.entries(projects).map(([id,p])=>`<button class="${S.view==='project'&&S.pid===id?'on':''}" data-p="${id}"><span class="dot ${pst(p)}"></span>${esc(p.name)}</button>`).join('')}`;
}

/* ---------- 画布（Muse 式） ---------- */
function renderCanvas(){
 $('#main').innerHTML=`<h1>想法画布</h1><p class="sub">随手记下的想法都在这里。拖动卡片整理，选中几张，变成一个项目。（示例数据）</p>
 <div class="row" style="margin-bottom:10px"><span class="note">已选 ${S.sel.size} 张</span>
  <button class="btn pri" id="mk" ${S.sel.size?'':'disabled'}>把选中的变成项目</button></div>
 <div class="board" id="board">${cards.map(c=>`<div class="card ${c.c} ${S.sel.has(c.id)?'sel':''}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">${esc(c.t)}<small>${esc(c.src)}</small></div>`).join('')}</div>
 <form class="cap" id="cap"><input id="capIn" placeholder="写下一个想法，或者点麦克风说" aria-label="写下一个想法"><button type="button" aria-label="语音输入" class="btn mic ${S.rec?'rec':''}" id="mic">${S.rec?'正在听…':'<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="1.5" width="6" height="10" rx="3"/><path d="M3 8.5a6 6 0 0 0 12 0M9 14.5V17"/></svg>'}</button><button class="btn pri">记下</button></form>
 ${S.asking?`<div class="ask"><b>AI 想先确认一件事</b><p style="margin:4px 0">这 ${S.sel.size} 张卡片看起来是同一件事：“${esc(topic())}”。第一版做成什么？</p>
  ${['网页','iOS App','微信小程序'].map(o=>`<button class="btn opt" data-ans="${o}">${o}</button>`).join('')}</div>`:''}`;
}

/* ---------- 项目（Manus 式执行 + 项目管理） ---------- */
function renderProject(){
 const p=P(), ts=allTasks(p), done=ts.filter(t=>t.st==='done').length, cur=task(S.tid)||ts[0];
 const wait=ts.filter(t=>t.st==='wait').length;
 const next=ts.find(t=>t.st==='todo');
 $('#main').innerHTML=`<h1>${esc(p.name)}</h1><p class="sub">一个目标，拆成几个可衡量的关键结果，再拆成 agent 能做的任务。（示例数据）</p>
 <div class="stats">
  <div class="stat"><b>${done} / ${ts.length}</b><span>任务完成</span><div class="bar"><i style="width:${done/ts.length*100}%"></i></div></div>
  <div class="stat"><b>$${p.spent.toFixed(2)}</b><span>已花 · ${p.tok} tokens</span></div>
  <div class="stat"><b>${p.remain}</b><span>预计还要花</span></div>
  <div class="stat"><b>${p.eta}</b><span>预计完成</span></div>
  <div class="stat"><b style="color:${wait?'var(--warn)':'inherit'}">${wait?`${wait} 件等你`:'没有卡住'}</b><span>卡在哪</span></div>
 </div>
 <div class="box treebox">${okrTree(p,cur)}
  <div class="treefoot"><span class="note">点任意任务，下面看 agent 在做什么。花钱之前都要你点一下。</span>
   ${next?`<button class="btn pri" data-start="${next.id}">批准并开始：${esc(next.t)} · 预计 ${next.est}</button>`:'<span class="note">所有任务都开始了</span>'}</div></div>
 <div class="box" style="margin-top:20px">${agentPanel(cur)}</div>
 </div>`;
}
function ring(f,c,z){const r=z/2-5,L=2*Math.PI*r,h=z/2;return `<svg class="ring" width="${z}" height="${z}" viewBox="0 0 ${z} ${z}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L*f} ${L}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${h+6}" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)">${Math.round(f*100)}%</text></svg>`}
function okrTree(p,cur){
 const fr=m=>m.tasks.filter(t=>t.st==='done').length/m.tasks.length;
 const of=p.miles.reduce((a,m)=>a+fr(m),0)/p.miles.length, ts=allTasks(p);
 const anim=!S.seen.has(S.pid);S.seen.add(S.pid);let k=0;
 return `<div class="stage"><div class="okr ${anim?'anim':''}" id="okr"><svg class="links" id="links"></svg>
 <div class="onode l0" id="n-o">${ring(of,'',84)}<div><div class="lab">目标</div><div class="tx">${esc(p.goal)}</div><div class="meta">${p.miles.length} 个关键结果 · ${ts.length} 个任务 · 已花 $${p.spent.toFixed(2)}</div></div></div>
 <ul class="krs">${p.miles.map((m,i)=>{const f=fr(m),w=m.tasks.some(t=>t.st==='wait'),r=m.tasks.some(t=>t.st==='run'),d=m.tasks.filter(t=>t.st==='done').length;
  return `<li><div class="kr l1 ${f===1?'done':w?'wait':r?'run':''}" id="n-k${i}" data-cls="${f===1?'ok':w?'wait':r?'run':''}"><div class="hd"><span class="lab">KR ${i+1}</span><span class="stt">${f===1?'已达成':w?'等你验收':r?'执行中':'未开始'}</span></div>
  <div class="t">${esc(m.t)}</div><div class="m">${esc(m.kr||'')}</div>
  <div class="big"><b>${Math.round(f*100)}<small>%</small></b><span>${d} / ${m.tasks.length} 任务</span></div><div class="kbar"><i style="width:${f*100}%"></i></div></div>
  <ul class="tks">${m.tasks.map(t=>`<li class="l2" style="--i:${k++}"><button class="tn ${t.st} ${t.id===cur.id?'on':''}" data-t="${t.id}" data-k="${i}"><span class="sd"></span><span>${esc(t.t)}</span><span class="c">${esc(t.m.replace('Claude ',''))} · ${t.cost?'$'+t.cost.toFixed(2):t.est}</span></button></li>`).join('')}</ul></li>`}).join('')}</ul></div></div>`;
}
function drawLinks(){
 const box=document.getElementById('okr'),svg=document.getElementById('links');if(!box||!svg)return;
 const B=box.getBoundingClientRect(),R=el=>{const r=el.getBoundingClientRect();return {l:r.left-B.left,t:r.top-B.top,w:r.width,h:r.height}};
 const o=R(document.getElementById('n-o'));let d='';
 box.querySelectorAll('.kr').forEach((kr,i)=>{const k=R(kr),x1=o.l+o.w/2,y1=o.t+o.h,x2=k.l+k.w/2,y2=k.t,my=(y1+y2)/2;
  d+=`<path class="${kr.dataset.cls}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`;
  box.querySelectorAll(`.tn[data-k="${i}"]`).forEach(tn=>{const t=R(tn),sx=k.l+14,sy=k.t+k.h,ex=t.l,ey=t.t+t.h/2;
   const c=tn.classList.contains('done')?'ok':tn.classList.contains('wait')?'wait':tn.classList.contains('run')?'run':'';
   d+=`<path class="${c}" d="M${sx},${sy} C${sx},${ey} ${sx},${ey} ${ex},${ey}"/>`});
 });
 svg.setAttribute('width',box.scrollWidth);svg.setAttribute('height',box.scrollHeight);svg.innerHTML=d;
}
addEventListener('resize',()=>drawLinks());
function agentPanel(t){
 const r=RUN[t.id];
 const head=`<div class="row"><h2 style="margin:0">${esc(t.t)}</h2><span class="chip">${esc(t.m)}</span></div>`;
 if(t.st==='todo')return head+`<p class="note">还没开始。批准后，agent 会在云端一步步做，你能在这里看到过程。</p>`;
 if(t.st==='done')return head+`<p class="note">已完成并验收 · 花了 $${t.cost.toFixed(2)}</p>${screen('done',t)}`;
 const n=t.step??r.steps.length;
 return head+`<ol class="steps">${r.steps.map((s,i)=>`<li class="${i<n?'':'todo'}">${i<n?icon('done'):i===n?icon('run'):icon('')}${esc(s)}</li>`).join('')}</ol>
  <div class="note">agent 的屏幕</div>${screen(t.st==='run'?'term':r.screen,t)}
  ${t.st==='wait'?`<div class="review"><b>做完了，等你验收</b><p class="note" style="margin:2px 0 8px">${esc(r.result)}</p>
   <div class="row"><button class="btn pri" data-ok="${t.id}">通过</button><input id="fix" placeholder="哪里要改？" style="flex:1;min-width:120px"><button class="btn" data-fix="${t.id}">让它改</button></div></div>`:''}`;
}
function screen(kind,t){
 if(kind==='term'){const r=RUN[t.id];return `<div class="screen"><div class="term">$ agent run "${esc(t.t)}"<br>&gt; ${esc(r.steps[Math.min(t.step,r.steps.length-1)])}…</div></div>`}
 const m={sync:['两台手机同步','A 手机：09:12 橘子 40g','B 手机：09:12 橘子 40g ✓','已同步'],push:['提醒','18:30 该喂年糕了','点开直接记录','好的'],food:['今天','下一次喂食 18:30','猫粮还够 5 天','记一次'],mail:['本周播客摘要','《慢慢说》5 条要点','《科技早知道》5 条要点','打开邮件'],done:[t.t,'已完成','截图 · 测试通过','查看']}[kind];
 return `<div class="screen row" style="align-items:flex-start;gap:14px"><div class="mock"><div class="t">${esc(m[0])}</div><div class="f">${esc(m[1])}</div><div class="f">${esc(m[2])}</div><div class="c">${esc(m[3])}</div></div><div class="note">截图由 agent 自动生成<br>（示例）</div></div>`;
}

/* ---------- 执行模拟 ---------- */
function runTask(id){
 const t=task(id);t.st='run';t.step=0;S.tid=id;render();
 const r=RUN[id]||{steps:['执行中'],screen:'done',result:'完成'};RUN[id]=r;
 const tick=()=>{t.step++;if(t.step>=r.steps.length){t.st='wait';t.cost=parseFloat((t.est||'$1').replace(/[^0-9.]/g,''))||1;P().spent+=t.cost;toast('做完了，等你验收');render();return}render();setTimeout(tick,900)};
 setTimeout(tick,900);
}

/* ---------- render & events ---------- */
function render(){renderNav();S.view==='canvas'?renderCanvas():renderProject();bindBoard();drawLinks();document.fonts&&document.fonts.ready.then(drawLinks)}
function bindBoard(){
 const b=$('#board');if(!b)return;
 b.querySelectorAll('.card').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
   const c=cards.find(x=>x.id==el.dataset.id), sx=e.clientX, sy=e.clientY, ox=c.x, oy=c.y; let moved=false;
   el.setPointerCapture(e.pointerId);
   const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    c.x=Math.max(0,Math.min(b.clientWidth-190,ox+dx));c.y=Math.max(0,Math.min(b.clientHeight-60,oy+dy));el.style.left=c.x+'px';el.style.top=c.y+'px'};
   const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);
    if(!moved){S.sel.has(c.id)?S.sel.delete(c.id):S.sel.add(c.id);S.asking=false;render()}};
   el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
  });
 });
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go){S.view='canvas';render()}
 else if(d.p){S.view='project';S.pid=d.p;S.tid=allTasks(P()).find(x=>x.st!=='done')?.id||allTasks(P())[0].id;render()}
 else if(t.id==='mk'){S.asking=true;render()}
 else if(d.ans){
  const picked=cards.filter(c=>S.sel.has(c.id));
  const nm=topic();const pid='p'+Date.now();
  projects[pid]={name:nm,spent:0,remain:'$11–20',eta:'10 月 8 日',tok:'0',goal:nm+'（第一版：'+d.ans+'）',
   miles:[{t:'第一版能用',kr:'你自己连续用 7 天',tasks:[{id:'m1',t:'整理需求和数据',st:'todo',m:'Claude Haiku 4.5',est:'$0.8–1.4'},{id:'m2',t:d.ans+'主页面',st:'todo',m:'Claude Sonnet 5',est:'$2.0–3.2'}]},
    {t:'打磨',kr:'没有卡住你的问题',tasks:[{id:'m3',t:'细节和边界情况',st:'todo',m:'Claude Sonnet 5',est:'$1.6–2.6'}]}]};
  cards=cards.filter(c=>!S.sel.has(c.id));S.sel.clear();S.asking=false;
  S.view='project';S.pid=pid;S.tid='m1';toast(`已从 ${picked.length} 张卡片生成项目，还没花钱`);render();
 }
 else if(d.t){S.tid=d.t;render()}
 else if(d.start){runTask(d.start)}
 else if(d.ok){const x=task(d.ok);x.st='done';toast('已验收，进度 +1');render()}
 else if(d.fix){const v=($('#fix').value||'').trim();if(!v){toast('先写一下哪里要改');return}toast('已打回，agent 按你的意见重做');runTask(d.fix)}
 else if(t.id==='mic'){if(S.rec)return;S.rec=true;render();setTimeout(()=>{S.rec=false;render();$('#capIn').value='猫粮快吃完时提醒我下单';$('#capIn').focus()},1500)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const v=$('#capIn').value.trim();if(!v)return;
 cards.push({id:Date.now(),x:20+Math.random()*300,y:20+Math.random()*200,c:/猫|喂/.test(v)?'y':'g',t:v,src:'刚刚'});
 toast(/猫|喂/.test(v)?'记下了，AI 觉得它和 PawLog 有关':'记下了');render();
});
render();
</script>
